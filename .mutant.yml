# Mutation testing for the money path. Run it with bin/mutant, not
# with `bundle exec mutant` directly: the script creates one test
# database per worker first (config/mutant/hooks.rb). Not part of
# bin/check, because one full run takes many minutes. docs/mutation-testing.md
# says what the report means and what to do with a survivor.
# Mutant is free on public open-source projects. This repository is
# public under the MIT license (LICENSE.md).
usage: opensource
includes:
  - spec
requires:
  - rspec/core
  - rails_helper
hooks:
  - ./config/mutant/hooks.rb
integration:
  name: rspec
  arguments:
    - --fail-fast
    - spec
# spec/spec_helper.rb skips SimpleCov when this is set. bin/mutant
# sets it for the parent process too.
environment_variables:
  MUTANT: "1"
matcher:
  # Every class in app/ and lib/. The four money classes came first
  # (2026-09-08); the rest followed on 2026-09-12. A full run is hours,
  # so bin/mutant is usually given a stage — one directory's worth of
  # subjects — after the `--`; docs/mutation-testing.md lists them.
  # Current is not here: it only declares attributes. Neither are the
  # three edit-form serializers (EventFormSerializer,
  # CommonHouseReservationFormSerializer, GuestRoomReservationFormSerializer),
  # for the same reason: they have no method to mutate. The request specs
  # and spec/serializers/api_contract_spec.rb pin their field lists.
  # spec/config/mutant_subjects_spec.rb checks this list against the
  # classes in app/ and lib/, so a new class cannot be left out of every
  # stage without a failing spec.
  subjects:
    # money
    - MealLedger*
    - Settlement*
    - Reconciliation*
    - BalanceRecalculation*
    # services
    - AuditDescription*
    - BillsPayload*
    - DateRangeDescription*
    - GuestAdd*
    - Healthcheck*
    - IdempotencyKeyHeader*
    - JwtAuth*
    - LargestRemainderSplit*
    - LedgerVerification*
    - LiveUpdate*
    - MailDeliveryFailure*
    - MealCostSummary*
    - MealIcalFeed*
    - PacedDelivery*
    - PasswordReset*
    - ReconciliationWarnings*
    - RecurringCatchUp*
    - ResidentNameShortener*
    - RetryOnConflict*
    - SettleAndNotify*
    - SnapshotRead*
    - ThirdCookWarning*
    - TrueOrFalse*
    # jobs, mailers, helpers, lib
    - ApplicationJob*
    - EnsureRotationsJob*
    - LivePushJob*
    - NotifyCooksJob*
    - RecurringJob*
    - RefreshBalancesJob*
    - VerifyLedgerJob*
    - ApplicationMailer*
    - ReconciliationMailer*
    - ResidentMailer*
    - ApplicationHelper*
    - BalanceDisplayHelper*
    - MoneyFieldHelper*
    - PhoneDisplayHelper*
    - RotationChoicesHelper*
    - ScheduleWeekLabelHelper*
    - SettlementLinesTable*
    - AdminOrderClause*
    - AssetCacheControl*
    - DatabasePoolCheck*
    - DeployConfigCheck*
    - BugsnagErrorSubscriber*
    # models and concerns
    - ApplicationRecord*
    - AdminUser*
    - Bill*
    - BillsSaveKey*
    - CommonHouseReservation*
    - Community*
    - Event*
    - Guest*
    - GuestAddKey*
    - GuestRoomReservation*
    - Holidays*
    - JobRun*
    - Key*
    - LedgerCheckRun*
    - MailDelivery*
    - Meal*
    - MealCharge*
    - MealResident*
    - MealSchedule*
    - Multiplier*
    - ReconciliationBalance*
    - Resident*
    - ResidentBalance*
    - Rotation*
    - StorableTime*
    - StorableTimeValidator*
    - Unit*
    - AppendOnly*
    - BelongsToTheCommunity*
    - ClosedMealAttendanceFreeze*
    - HasPhoneNumber*
    - LocksItsMealFirst*
    - NotesMealLiveUpdate*
    - ReconciledMealImmutability*
    # controllers and serializers
    - ApiController*
    - ApplicationController*
    - FallbackController*
    - RefusedDestroyMessage*
    - SuperuserAdapter*
    - Api::V1::CommonHouseReservationsController*
    - Api::V1::CommunitiesController*
    - Api::V1::EventsController*
    - Api::V1::GuestRoomReservationsController*
    - Api::V1::MealsController*
    - Api::V1::ReconciliationsController*
    - Api::V1::ResidentsController*
    - Api::V1::RotationsController*
    - Api::V1::SessionsController*
    - Api::V1::SiteController*
    - AuditSerializer*
    - BillSerializer*
    - CalendarSerializer*
    - CommonHouseReservationSerializer*
    - EventSerializer*
    - GuestRoomReservationSerializer*
    - GuestReplayedSerializer*
    - GuestSerializer*
    - MealFormSerializer*
    - MealResidentSerializer*
    - MealSerializer*
    - ReconciliationPreviewSerializer*
    - ResidentBirthdaySerializer*
    - RotationLogSerializer*
    - RotationSerializer*
  ignore:
    # The admin search and sort allowlists (AdminOrderClause reads them
    # for ?order=). Every mutation of a list survives because
    # spec/models/application_record_ransackable_attributes_spec.rb checks
    # the rule (every name is a column, and none is a secret), not the
    # exact list.
    - AdminUser.ransackable_attributes
    - Bill.ransackable_attributes
    - Bill.ransackable_associations
    - CommonHouseReservation.ransackable_attributes
    - Community.ransackable_attributes
    - Event.ransackable_attributes
    - GuestRoomReservation.ransackable_attributes
    - JobRun.ransackable_attributes
    - LedgerCheckRun.ransackable_attributes
    - MealCharge.ransackable_attributes
    - Meal.ransackable_attributes
    - Reconciliation.ransackable_attributes
    - Resident.ransackable_attributes
    - Rotation.ransackable_attributes
    - Unit.ransackable_attributes
    # A class-body macro. It runs once, when MealCharge, LedgerCheckRun,
    # Reconciliation and ReconciliationBalance are loaded, and registers
    # their callbacks; mutant inserts a mutated copy after that, so no
    # mutation of it can run (2026-09-12: all 50 survived, including
    # "register no callback at all"). The callbacks it registers are
    # mutated through AppendOnly#append_only_refuse.
    - AppendOnly::ClassMethods#append_only
mutation:
  # Sorbet runtime calls are not code under test. `T.must(x)` becomes
  # `x` and nothing can fail, because the value was never nil; `T.let`
  # is a no-op at runtime. Skipping the call skips its arguments too,
  # which is fine for T.let (every use wraps a literal) and cheap for
  # T.must (every use wraps a column read). T.cast is not skipped: one
  # use wraps a query that should be mutated. The other, in
  # GuestAdd#vegetarian, leaves two survivors, its type arguments: T.cast
  # checks nothing at runtime (2026-10-09).
  ignore_patterns:
    - send{receiver=const{name=T} selector=must}
    - send{receiver=const{name=T} selector=let}
    # A log line is not behaviour. Every `Rails.logger.info(...)`,
    # `.warn`, `.error` and `.debug` is skipped, arguments included: the
    # stage A run (2026-09-12) had over a hundred survivors that were only
    # the wording or presence of a log line, in LedgerVerification#log,
    # EnsureRotationsJob#run, Healthcheck.ping, MailDeliveryFailure.report,
    # PacedDelivery#log_cap and SetMultipliersJob#run. What a run wrote to
    # the database (JobRun, LedgerCheckRun) is behaviour and is still
    # mutated.
    - send{receiver=send{receiver=const{name=Rails} selector=logger} selector=info}
    - send{receiver=send{receiver=const{name=Rails} selector=logger} selector=warn}
    - send{receiver=send{receiver=const{name=Rails} selector=logger} selector=error}
    - send{receiver=send{receiver=const{name=Rails} selector=logger} selector=debug}
  # A mutation that no example fails within this many seconds is
  # reported as timed out, which counts as not killed
  # (coverage_criteria below; bin/mutant keeps MUTANT_JOBS away from
  # mutant, which would turn that off). The limit is for the whole list
  # of examples a mutation runs, one after another, not for one example.
  # A mutation no example fails runs the whole list: for a MealLedger
  # method that is 620 examples, and they took 113 to 118 seconds on six
  # workers (2026-09-28). So a limit of 120 cut those runs off, and
  # counted them as kills. With room above the slowest list, a timeout
  # means a mutation made a loop or a lock wait that never ends, and
  # that is worth reading.
  timeout: 300.0
coverage_criteria:
  test_result: true
  timeout: false
  process_abort: false

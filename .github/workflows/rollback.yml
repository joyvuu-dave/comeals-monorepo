name: Rollback

# Manual production rollback (docs/deploy-confidence-plan.md, item 8).
# Heroku rollback is the mitigation; the durable rollback is fixing
# main (usually git revert). This workflow does the mitigation and
# makes the durable part unavoidable: it sets DEPLOY_HOLD so the daily
# deploy refuses to re-ship the same sha tomorrow, and files an issue
# holding the reason.
#
# Rolling back only the code is safe only when no migration ran since
# the release it goes back to: the older code may not run on what a
# migration made (#133). So the workflow refuses that, unless it is given
# the backup taken before the deploy, which it restores first, or told
# that every migration since is one the older code runs beside
# (docs/runbooks/undo-a-deploy.md). A restore loses every write made
# after the backup.
#
# It can also run on staging, to practise the undo in the rehearsal; then
# it only rolls back and smokes, and leaves the bookkeeping alone.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why production is being rolled back (one line, required)"
        type: string
        required: true
      release:
        description: "Heroku release to roll back to (e.g. v612; empty = previous)"
        type: string
        required: false
      backup:
        description: "Backup to restore first, from heroku pg:backups (e.g. b245). Needed when a migration ran since that release; loses every write after it"
        type: string
        required: false
      code_only_is_safe:
        description: "Every migration since that release is one the older code runs beside: roll back only the code"
        type: boolean
        default: false
      app:
        description: "The app to roll back"
        type: choice
        options:
          - comeals-monorepo
          - comeals-staging
        default: comeals-monorepo

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

# The inputs reach the shell as variables, never pasted into a script.
env:
  APP: ${{ inputs.app }}
  RELEASE: ${{ inputs.release }}
  BACKUP: ${{ inputs.backup }}
  REASON: ${{ inputs.reason }}
  HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

jobs:
  rollback:
    # ubuntu-24.04, not ubuntu-latest: the note at the top of ci.yml's jobs.
    runs-on: ubuntu-24.04
    # The restore and the heroku rollback run in the first minutes (the
    # database is about 33 MB); everything after them is bookkeeping. If
    # a later step hangs, fail in 35 minutes — production is already
    # fixed by then — instead of holding the shared "deploy" concurrency
    # group for 6 hours. It was 15 until steps with their own time limits
    # were added before the restore: the smoke test's setup (#251) and,
    # when a backup is restored, the PostgreSQL client and Ruby (#248).
    # On a slow day those use up to 17 minutes before the rollback
    # starts. 35 keeps the old 15 for the restore, the rollback and what
    # follows, plus a few minutes for the short steps with no limit.
    timeout-minutes: 35
    environment: production
    # The smoke test drives the Google Chrome the runner image already
    # has, not Playwright's Chromium: that one needs system packages from
    # Ubuntu's mirror, and a slow mirror kept the smoke test from running
    # after a rollback (#251). tests/smoke/browser.js reads this.
    env:
      SMOKE_BROWSER_CHANNEL: chrome
    steps:
      # The whole history: bin/rollback-check compares the two commits.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl -s https://cli-assets.heroku.com/install.sh | sh

      # The smoke test at the end needs Node, the npm packages and a
      # browser that starts. Get them before anything changes, so a slow
      # download cannot hold up the check after the rollback (#251). Each
      # of these steps may fail without stopping the rollback: nothing
      # may block undoing a bad deploy. bin/lib/rollback/smoke-ready says
      # whether the smoke test can run, and the job summary says why not.
      - name: Set up Node for the smoke test
        id: node
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install the npm packages for the smoke test
        id: npm
        if: steps.node.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: npm ci
      - name: Check that the smoke test's browser starts
        id: browser
        if: steps.npm.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        run: node tests/smoke/browser.js
      - name: Say whether the smoke test can run
        id: smoke_ready
        continue-on-error: true
        env:
          NODE_OUTCOME: ${{ steps.node.outcome }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: bin/lib/rollback/smoke-ready

      - name: Find the release to go back to
        id: find
        run: bin/lib/rollback/find-release

      - name: Check the migrations
        env:
          TARGET_SHA: ${{ steps.find.outputs.target_sha }}
          BAD_SHA: ${{ steps.find.outputs.bad_sha }}
          CODE_ONLY_IS_SAFE: ${{ inputs.code_only_is_safe }}
        run: bin/lib/rollback/check-migrations

      # Reading the backup's migrations needs a pg_restore at least as new
      # as the PostgreSQL that made it (18 on Heroku). Ubuntu 24.04 has no
      # 18 client, so this installs it the way ci.yml's ruby-test job
      # does. The time limit keeps a slow apt mirror (#240) from using up
      # the job's time; when it fails, nothing was changed yet.
      - name: Install the PostgreSQL 18 client, to read the backup
        if: inputs.backup != ''
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      # check-backup runs bin/lib/schema-check, the release phase's rule
      # (lib/squashed_migrations_check.rb), which needs the app's gems.
      - name: Install Ruby and the gems, to check the backup
        if: inputs.backup != ''
        timeout-minutes: 5
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Before anything changes: refuse a backup that does not fit the
      # release it goes back to (#248). One missing a migration its
      # db/structure.sql lists up to its db/production_schema_version.txt,
      # which the old code's db:migrate cannot bring up to date; one with a migration newer than the old
      # code knows; and an id that is not one of this app's own backups.
      - name: Check the backup
        if: inputs.backup != ''
        env:
          TARGET: ${{ steps.find.outputs.target }}
          TARGET_SHA: ${{ steps.find.outputs.target_sha }}
        run: bin/lib/rollback/check-backup

      # Maintenance from before the restore until the old code serves, so
      # nobody writes to the restored database through the new code.
      # Maintenance stops web requests only. The jobs run on the worker
      # dyno, so web and the worker go to 0 before the restore: no job of
      # the new code runs on the restored database (#179). The restore
      # waits until no Solid Queue process sends heartbeats too, because
      # heroku ps can list no worker while one still runs (#245,
      # bin/lib/wait_until_stopped.sh). Web comes back
      # in "Start the web dyno"; the worker comes back in "Roll back", and
      # only when the release it goes back to has a worker process type.
      # The maintenance page shows with no web dyno too.
      - name: Stop the web and worker dynos and restore the backup
        id: restore
        if: inputs.backup != ''
        run: bin/lib/rollback/restore-backup

      # A release from before the worker dyno has no worker process type:
      # the worker goes to 0 before the rollback and stays there.
      # Otherwise it is scaled to 1 after it.
      - name: Roll back
        id: roll
        env:
          TARGET: ${{ steps.find.outputs.target }}
          BAD_SHA: ${{ steps.find.outputs.bad_sha }}
          TARGET_HAS_WORKER: ${{ steps.find.outputs.target_has_worker }}
        run: bin/lib/rollback/roll-back

      - name: Start the web dyno
        id: start
        if: inputs.backup != ''
        env:
          WEB_COUNT: ${{ steps.restore.outputs.web_count }}
        run: bin/lib/rollback/start-web

      - name: End maintenance
        if: inputs.backup != ''
        run: heroku maintenance:off -a "$APP"

      # Says which state a stopped undo left production in, and what to run
      # by hand. It does not start web or the worker again: after the
      # restore and before the rollback, they would run the new code on
      # the restored database. Maintenance on with both at 0 is safe;
      # nobody can write.
      - name: Say what to do by hand
        if: (failure() || cancelled()) && inputs.backup != '' && steps.restore.outcome != 'skipped'
        env:
          RESTORE: ${{ steps.restore.outcome }}
          ROLL: ${{ steps.roll.outcome }}
          START: ${{ steps.start.outcome }}
          WEB_COUNT: ${{ steps.restore.outputs.web_count }}
          TARGET: ${{ steps.find.outputs.target }}
          TARGET_HAS_WORKER: ${{ steps.find.outputs.target_has_worker }}
          URL: ${{ steps.find.outputs.url }}
        run: bin/lib/rollback/say-what-to-do

      # The bookkeeping runs once the rollback worked, before the smoke
      # test and whatever happened to the steps in between: production
      # runs the old code now, and without DEPLOY_HOLD the weekly deploy
      # would ship the bad sha again. Before #240 it ran after the smoke
      # test, so a Playwright install that failed or used up the job's
      # time skipped all three steps.
      #
      # The weekly deploy refuses while this is set. It clears when a
      # person fixes main (usually git revert) and removes the variable.
      - name: Hold the weekly deploy
        if: always() && steps.roll.outcome == 'success' && inputs.app == 'comeals-monorepo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set DEPLOY_HOLD \
            --body "rolled back $(date -u +%Y-%m-%d): $REASON"

      # Make the GitHub Releases tell the truth: mark the release that
      # pointed at the rolled-back sha. Deploys older than the release
      # process have no release to mark — say so and move on.
      - name: Mark the release notes
        if: always() && steps.roll.outcome == 'success' && inputs.app == 'comeals-monorepo'
        env:
          GH_TOKEN: ${{ github.token }}
          BAD_SHA: ${{ steps.roll.outputs.bad_sha }}
        run: bin/lib/rollback/mark-release-notes

      - name: File the follow-up issue
        if: always() && steps.roll.outcome == 'success' && inputs.app == 'comeals-monorepo'
        env:
          GH_TOKEN: ${{ github.token }}
          BAD_SHA: ${{ steps.roll.outputs.bad_sha }}
          LIVE_SHA: ${{ steps.roll.outputs.live_sha }}
        run: bin/lib/rollback/file-issue

      # The smoke test runs even when a bookkeeping step failed: it is
      # the only check that the old code serves. Node, the npm packages
      # and the browser were set up before the rollback; when that failed,
      # this step is skipped and the next one fails the run. It signs in with the owner's accounts on production only; on
      # staging the credentials are empty, and it checks the public pages.
      # bin/lib/rollback/smoke says when a login was refused (stale
      # secrets) rather than the old code broken, and on production ends
      # with code 2 when a secret is not set.
      - name: Smoke the rolled-back site
        if: ${{ !cancelled() && steps.roll.outcome == 'success' && steps.smoke_ready.outputs.ready == 'true' }}
        env:
          SMOKE_EMAIL: ${{ inputs.app == 'comeals-monorepo' && secrets.SMOKE_EMAIL || '' }}
          SMOKE_PASSWORD: ${{ inputs.app == 'comeals-monorepo' && secrets.SMOKE_PASSWORD || '' }}
          SMOKE_ADMIN_EMAIL: ${{ inputs.app == 'comeals-monorepo' && secrets.SMOKE_ADMIN_EMAIL || '' }}
          SMOKE_ADMIN_PASSWORD: ${{ inputs.app == 'comeals-monorepo' && secrets.SMOKE_ADMIN_PASSWORD || '' }}
        run: bin/lib/rollback/smoke "${{ steps.find.outputs.url }}"

      # A rollback whose site could not be smoked must not look like one
      # that was. The job summary already says why at the top, unless the
      # step that says whether the smoke test can run failed itself: then
      # it set no reason, and this step gives its own.
      - name: Say that the site was not checked
        if: ${{ !cancelled() && steps.roll.outcome == 'success' && steps.smoke_ready.outputs.ready != 'true' }}
        env:
          PROBLEM: ${{ steps.smoke_ready.outcome == 'success' && steps.smoke_ready.outputs.problem || 'the check for whether the smoke test can run failed' }}
        run: |
          echo "The rollback is done, but the site was not checked: the smoke test cannot run ($PROBLEM). Check the site by hand." >&2
          exit 1

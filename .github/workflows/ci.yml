name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every job has a timeout of about 2-3x its normal duration. Without
  # one, GitHub's default is 6 hours: a hung step (a stalled browser
  # download did this on 2026-08-15) holds the run open all that time.
  # Normal durations: each ruby-test part ~13 min, node-e2e ~14 min,
  # visual-tests ~8 min, integration-tests ~6 min, everything else under
  # two minutes.
  # The two Playwright jobs get 25 instead of 2-3x, because a slow
  # download can make them much longer: they pull the Playwright Docker
  # image (bin/lib/playwright-docker), and on 2026-08-19 a slow CDN made
  # a browser download take 12 minutes.
  #
  # Every workflow names ubuntu-26.04, not ubuntu-latest. That is the
  # Ubuntu that Heroku's heroku-26 stack runs, so CI and production use
  # the same system libraries. ubuntu-latest moves to a new Ubuntu when
  # GitHub decides. A new image changes the system libraries and fonts
  # the browser suites use, so move to one on purpose, in its own
  # change, so a failure it causes is not mixed up with one from the
  # code. The Linux screenshots are made in the Playwright "noble"
  # container, which is Ubuntu 24.04 whatever the runner is
  # (bin/visual-linux).
  ruby-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  # The RSpec suite in two parts that run at the same time. In one job it
  # took about 24 minutes, close to the limit. bin/rspec-shard puts each
  # spec file in one part, split by how long the files took in CI
  # (spec/rspec_file_times.json), so a file always runs whole: the bashcov
  # check in spec/bin/deploy_spec.rb needs every example of its file. A
  # part does not check the coverage minimum; ruby-coverage below does,
  # for the whole suite.
  ruby-test:
    name: ruby-test (${{ matrix.part }}/2)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
    steps:
      - uses: actions/checkout@v6
      # pg_dump must be the same version as the server, minor version
      # included. spec/config/procfile_spec.rb runs db:migrate, which dumps
      # the schema, and spec/db/structure_sql_spec.rb compares a dump with
      # db/structure.sql. pg_dump refuses a server newer than its own
      # major version, and an older minor version can print lines a newer
      # one leaves out: on 2026-11-12 the postgres:18 image moved to 18.7
      # while the runner's pg_dump was 18.6, and the dump gained an
      # "ALTER COLUMN ... SET (pg_attver=...)" line for every column. So
      # every postgres image is pinned to the runner's pg_dump version,
      # and this step fails, naming the version to pin, when the runner's
      # pg_dump changes.
      - name: Check that pg_dump is the server's version
        run: |
          client=$(pg_dump --version | awk '{ print $3 }')
          server=$(psql postgres://postgres:postgres@localhost:5432/comeals_test -tAc 'SHOW server_version' | awk '{ print $1 }')
          echo "pg_dump ${client}, server ${server}"
          if [ "$client" != "$server" ]; then
            echo "pg_dump is ${client} and the server is ${server}. They must be the same version." \
                 "Set every postgres image in .github/workflows to postgres:${client}." >&2
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # No front-end build here, on purpose: the request specs bring
      # their own index.html and manifest.json when there is none
      # (spec/support/spa_page.rb, asset_cache_control_spec.rb), and
      # this job is what checks that they still do (#142).
      - run: bin/rails db:schema:load
      - run: bin/rspec-shard ${{ matrix.part }} 2
      # This part's coverage, for ruby-coverage. Uploaded even when a spec
      # failed, so the report still names what this part covered.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ruby-coverage-part-${{ matrix.part }}
          path: coverage/.resultset.json
          retention-days: 7
          if-no-files-found: ignore
          # The default skips dotfiles.
          include-hidden-files: true
      # How long each spec file took, to refresh the split:
      # bin/rspec-shard --times <both rspec-part-*.json files>
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rspec-times-part-${{ matrix.part }}
          path: tmp/rspec-part-${{ matrix.part }}.json
          retention-days: 7
          if-no-files-found: ignore

  # Joins the coverage of both parts and checks the 100% line and branch
  # minimum for the whole suite (bin/coverage-collate, with the profile in
  # spec/simplecov_profile.rb). Runs only when both parts passed: a part
  # that failed may have stopped early, and its coverage would be short.
  ruby-coverage:
    needs: ruby-test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/download-artifact@v7
        with:
          pattern: ruby-coverage-part-*
          path: coverage-parts
      - run: bin/coverage-collate 2 coverage-parts/*/.resultset.json
      # A miss on Linux that a laptop does not show needs the report to
      # name the branch; the summary only names the file.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ruby-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
          # .resultset.json holds the per-branch counts; the default skips dotfiles.
          include-hidden-files: true

  node-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Vitest strips types without checking them (esbuild), so the
  # API-contract compile gate in tests/unit/api_contract.test.ts only
  # bites here. Without this job, a type-level drift at the API
  # boundary merges green.
  node-typecheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  node-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: bin/npm-audit

  # The whole history, with this repository's rules (.gitleaks.toml).
  # GitHub's secret scanning runs too, but knows only the big providers'
  # token shapes. Free for a personal account; an organization would
  # need GITLEAKS_LICENSE.
  secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The action picks its own gitleaks version unless told, and on
      # 2026-10-16 it picked 8.24.3, which does not read the [[allowlists]]
      # tables in .gitleaks.toml: it found 18 leaks in main's history that
      # bin/check allows, and refused a pull request over a test token the
      # file allows. Name the version bin/check uses.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  ruby-security:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec brakeman --no-pager -q
      - run: bundle exec bundle audit check --update

  # The same quality gate bin/check runs: complexity, duplication, and
  # smells averaged over app and lib, minimum score 80.
  ruby-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubycritic app lib --no-browser --format console --minimum-score 80

  # The bin/check steps that no other job here runs (#225). Before this
  # job only the nightly ran them, so a pull request that broke one
  # merged green and the nightly failed the next morning. bin/check runs
  # them by name, the same code as on a laptop. The RBI step checks the
  # files as committed: nothing in this job runs bin/tapioca without
  # --verify first.
  ruby-static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
      # `bin/tapioca dsl --verify` boots the development environment,
      # and config/initializers/pusher.rb refuses to boot it without
      # these. Placeholders: nothing here calls Pusher.
      PUSHER_APP_ID: "test"
      PUSHER_KEY: "test"
      PUSHER_SECRET: "test"
      PUSHER_CLUSTER: "test"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # database_consistency, the dsl RBI check and annotaterb read the
      # schema from the database.
      - run: bin/rails db:schema:load
      - run: >-
          bin/check sorbet rbi_fresh debride fasterer database_consistency
          todo_markers app_zone_dates new_js_files annotations

  # The proofs in proofs/ (docs/proofs.md). bin/dafny-verify downloads
  # the pinned Dafny release on every run here, which takes a few
  # seconds. The second step checks every proof again on 20 solver seeds,
  # so a proof that passes only on some seeds fails in the change that
  # made it so ("A proof must pass on every solver seed").
  # Mutant on the methods this push or pull request changed, and on the
  # methods whose spec files changed or were deleted, so an example made
  # weaker is caught here too (docs/mutation-testing.md, "Accepted
  # survivors"). It fails on a survivor that
  # config/mutant/accepted_survivors/ does not list, and on an entry for a
  # method that ran whose mutation no longer survives. A change to
  # spec/support, a factory or rails_helper can weaken any example; the
  # weekly full run (mutant.yml) catches that. A change to a money method
  # or its spec can take an hour here: each of its survivors runs the 600
  # to 900 examples that prove the method.
  mutant-changed:
    runs-on: ubuntu-26.04
    # The Mutate step stops mutant after 60 minutes and fails. This limit
    # only catches a step that hangs: a job stopped by GitHub shows as
    # cancelled, not failed.
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # The PG* variables are for createdb and dropdb, which bin/mutant runs
    # to give each worker its own copy of the test database.
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      # The commit to compare with: the pull request's base, or the
      # commit main was at before this push.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          # --since needs the base commit in the clone.
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:schema:load
      # The methods that changed, and the methods whose examples changed or
      # were deleted (bin/mutant-spec-subjects says how it finds them).
      # One spec file can name many classes (write_messages_spec.rb names
      # seven), and a method takes 2 to 6 minutes. On 2026-11-11 one
      # removed example chose 113 methods, and the job ran for 6 hours.
      # So the methods found only through their examples run when there
      # are 10 or fewer; above that they are listed, and the Saturday run
      # mutates them.
      - name: Choose the methods
        run: |
          set -euo pipefail
          MUTANT=1 bundle exec mutant environment subject list --since "$BASE" > changed.txt
          MUTANT=1 bundle exec mutant environment subject list > all-subjects.txt
          grep -E '^[A-Z][^ ]*[#.][^ ]+$' changed.txt | sort -u > methods.txt || true
          bin/mutant-spec-subjects "$BASE" all-subjects.txt | sort -u > examples.txt
          comm -13 methods.txt examples.txt > examples-only.txt
          if [ "$(wc -l < examples-only.txt)" -gt 10 ]; then
            echo "::warning::The examples of $(wc -l < examples-only.txt) methods changed, more than 10. They are left to the Saturday run. To mutate them now, run the Mutant workflow with these subjects: $(tr '\n' ' ' < examples-only.txt)"
            cp methods.txt subjects.txt
          else
            sort -u methods.txt examples-only.txt > subjects.txt
          fi
          echo "$(wc -l < methods.txt) methods changed since $BASE, and the examples of $(wc -l < examples-only.txt) more changed. Mutating:"
          cat subjects.txt
      - name: Mutate
        run: |
          set -o pipefail
          # A method name like same? or [] must not be read as a file pattern.
          set -f
          if [ ! -s subjects.txt ]; then
            echo "No method in .mutant.yml's subjects, or its examples, changed."
            exit 0
          fi
          # GitHub runs the step with bash -e, which would stop at a failed
          # mutant run before the message below.
          set +e
          # shellcheck disable=SC2046 # one subject per word
          timeout --kill-after=2m 60m env MUTANT_JOBS=4 bin/mutant -- $(cat subjects.txt) 2>&1 \
            | tr '\r' '\n' | grep -v '^progress: '
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Mutant did not finish in 60 minutes. Run the Mutant workflow with these subjects: $(tr '\n' ' ' < subjects.txt)"
          fi
          exit "$status"

  proofs:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: bin/check dafny
      - run: bin/dafny-verify --seeds 20

  bundle-budget:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bin/bundle-budget

  # The mocked E2E fixtures are generated from the real API
  # (rake test:generate_fixtures). Regenerate and fail on any diff: a
  # commit that changes an API response must carry its fixture change.
  api-fixtures:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # The generation task shells out to prettier for formatting.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: bin/rails db:schema:load
      - run: bundle exec rake test:generate_fixtures
      - name: Fail if fixtures are stale
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/)" ]; then
            echo "Fixtures are stale — run 'RAILS_ENV=test bundle exec rake test:generate_fixtures' and commit the result:"
            git status --porcelain tests/fixtures/
            git diff tests/fixtures/
            exit 1
          fi

  node-unit-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # test:coverage, so the thresholds in vitest.config.mjs are enforced.
      - run: npm run test:coverage
      # bin/bundle-budget's tests, with Node's coverage of it held at 100%.
      - run: npm run test:bin

  node-e2e-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # The admin Playwright project boots a real Rails server
    # (tests/admin/server.sh), so this job needs Ruby and Postgres in
    # addition to Node. The server script creates and seeds its own
    # comeals_admin_e2e database, so no schema-load step is needed here.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
      ADMIN_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_admin_e2e
      # The visual suite runs in its own job (visual-tests), with the
      # test runner inside the Playwright container, the same way
      # bin/update-linux-snapshots records the goldens (bin/visual-linux).
      PLAYWRIGHT_SKIP_VISUAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The browsers run in Playwright's Docker image, not on the runner
      # (bin/lib/playwright-docker, #252). On the runner they need Ubuntu
      # packages from apt, and the apt mirror is often slow: on 2026-10-26
      # that step ran out of time five times. The image has the packages
      # already. The tests, Vite and Rails still run on the runner.
      - run: bin/lib/playwright-docker npm run test:e2e
      # The screen-state measure compares counters, not pixels, so it
      # can run in this job, which leaves the pixel comparison out.
      - run: bin/lib/playwright-docker bin/visual-coverage
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  visual-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # The admin pages are in the visual suite, and their Rails server runs
    # on the runner (the Playwright container has no Ruby), so this job
    # needs Ruby and Postgres like node-e2e-tests does.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholders, like the other jobs: the build throws on a missing
      # Pusher key, and the visual tests fail on any page error. Locally
      # these come from .env; CI has no .env. bin/visual-linux forwards
      # them into the container.
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
      ADMIN_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_admin_e2e
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # bin/visual-linux runs the visual suite inside the official
      # Playwright container — the same one bin/update-snapshots records
      # the -linux goldens in. Comparing on the plain runner fails: it
      # renders text about a pixel differently, which the 0.1% diff
      # budget does not absorb.
      - run: bin/visual-linux
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-visual-report
          path: test-results/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Load the schema the same way ruby-test does. On a fresh empty
      # database, db:prepare inside bin/test-integration would instead
      # replay every migration from zero and re-dump structure.sql.
      - run: bin/rails db:schema:load
      # The browsers run in Playwright's Docker image; the comment in
      # node-e2e-tests says why.
      - run: bin/lib/playwright-docker bin/test-integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-integration-report
          path: test-results/
          retention-days: 7

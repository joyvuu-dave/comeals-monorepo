name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every job has a timeout of about 2-3x its normal duration. Without
  # one, GitHub's default is 6 hours: a hung step (a stalled browser
  # download did this on 2026-08-15) holds the run open all that time.
  # Normal durations: node-e2e ~6 min, ruby-test and integration-tests
  # ~4.5 min, visual-tests ~2.5 min, everything else under a minute.
  ruby-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  ruby-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create frontend build stubs
        run: |
          echo '<!DOCTYPE html><html><head></head><body><div id="root"></div></body></html>' > public/index.html
          mkdir -p public/.vite
          echo '{}' > public/.vite/manifest.json
      - run: bin/rails db:schema:load
      - run: bundle exec rake

  node-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Vitest strips types without checking them (esbuild), so the
  # API-contract compile gate in tests/unit/api_contract.test.ts only
  # bites here. Without this job, a type-level drift at the API
  # boundary merges green.
  node-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm audit

  ruby-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec brakeman --no-pager -q
      - run: bundle exec bundle audit check --update

  # The same quality gate bin/check runs: complexity, duplication, and
  # smells averaged over app and lib, minimum score 80.
  ruby-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubycritic app lib --no-browser --format console --minimum-score 80

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bin/bundle-budget

  # The mocked E2E fixtures are generated from the real API
  # (rake test:generate_fixtures). Regenerate and fail on any diff: a
  # commit that changes an API response must carry its fixture change.
  api-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # The generation task shells out to prettier for formatting.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same stubs as ruby-test: the app boots without a Vite build.
      - name: Create frontend build stubs
        run: |
          echo '<!DOCTYPE html><html><head></head><body><div id="root"></div></body></html>' > public/index.html
          mkdir -p public/.vite
          echo '{}' > public/.vite/manifest.json
      - run: bin/rails db:schema:load
      - run: bundle exec rake test:generate_fixtures
      - name: Fail if fixtures are stale
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/)" ]; then
            echo "Fixtures are stale — run 'RAILS_ENV=test bundle exec rake test:generate_fixtures' and commit the result:"
            git status --porcelain tests/fixtures/
            git diff tests/fixtures/
            exit 1
          fi

  node-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  node-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The admin Playwright project boots a real Rails server
    # (tests/admin/server.sh), so this job needs Ruby and Postgres in
    # addition to Node. The server script creates and seeds its own
    # comeals_admin_e2e database, so no schema-load step is needed here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
      ADMIN_E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_admin_e2e
      # The visual suite runs in its own job (visual-tests) inside the
      # Playwright container, because this runner renders text about a
      # pixel differently than the container that records the goldens.
      PLAYWRIGHT_SKIP_VISUAL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders, like the other jobs: the build throws on a missing
      # Pusher key, and the visual tests fail on any page error. Locally
      # these come from .env; CI has no .env. bin/visual-linux forwards
      # them into the container.
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
    steps:
      - uses: actions/checkout@v6
      # bin/visual-linux runs the visual suite inside the official
      # Playwright container — the same one bin/update-snapshots records
      # the -linux goldens in. Comparing on the plain runner fails: it
      # renders text about a pixel differently, which the 0.1% diff
      # budget does not absorb.
      - run: bin/visual-linux
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-visual-report
          path: test-results/
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comeals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/comeals_test
      VITE_PUSHER_KEY: "test-key-for-ci"
      VITE_PUSHER_CLUSTER: "us2"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Load the schema the same way ruby-test does. On a fresh empty
      # database, db:prepare inside bin/test-integration would instead
      # replay every migration from zero and re-dump structure.sql.
      - run: bin/rails db:schema:load
      - run: bin/test-integration
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-integration-report
          path: test-results/
          retention-days: 7

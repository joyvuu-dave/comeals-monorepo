name: Site up

# The external uptime monitor. Every 5 minutes: curl the site and the API
# version endpoint, then report the result to healthchecks.io — a success
# ping when both answer 200, a /fail ping (which alerts at once) when
# either does not.
#
# Why this shape and not an uptime service: the alert arrives through the
# same healthchecks.io channel the nightly jobs already use, the monitor's
# definition is this file instead of settings in someone's dashboard, and
# the monitor's own death is loud — if GitHub stops running this workflow,
# healthchecks.io fires "check is late", exactly as it does for a nightly
# job that stops running. An uptime service that silently breaks alerts
# no one.
#
# The healthchecks.io check is named site-up. It is created automatically
# by the first ping (create=1). Its Period and Grace live in the
# healthchecks.io dashboard: Period 10 minutes, Grace 20 minutes — wide
# enough that GitHub's cron jitter (runs are routinely minutes late)
# never fires a false "late" alert, tight enough that a dead monitor is
# reported within the hour.
#
# HEALTHCHECKS_PING_KEY is the same ping key the Heroku app uses
# (app/services/healthcheck.rb), stored as a GitHub Actions secret.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl the site, report to healthchecks.io
        env:
          PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
        run: |
          set -u
          failures=""
          for url in "https://comeals.com" "https://comeals.com/api/v1/version"; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 --retry 2 --retry-delay 5 "$url" || echo "000")
            echo "$url -> HTTP $status"
            if [ "$status" != "200" ]; then
              failures="$failures$url returned HTTP $status. "
            fi
          done

          if [ -z "$failures" ]; then
            curl -fsS --max-time 15 --retry 3 "https://hc-ping.com/$PING_KEY/site-up?create=1" > /dev/null
          else
            # /fail alerts immediately instead of waiting for the grace
            # period. The body shows up in the healthchecks.io log.
            curl -fsS --max-time 15 --retry 3 --data-raw "$failures" \
              "https://hc-ping.com/$PING_KEY/site-up/fail?create=1" > /dev/null
            echo "$failures"
            exit 1
          fi

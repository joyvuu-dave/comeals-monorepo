- subject: PacedDelivery#initialize
  kind: same-answer
  why: >-
    Every caller passes an Array (CommonHouseMailJob) or an ActiveRecord relation (from
    MailDelivery.not_yet_sent), and both answer `to_ary` with the same Array as `to_a`.
  diff: |
    @@ -1,7 +1,7 @@
     def initialize(items, mailer:, recipient:, after_send:, build:)
    -  @items = items.to_a
    +  @items = items.to_ary
       @mailer = mailer
       @recipient = recipient
       @after_send = after_send
       @build = build
     end

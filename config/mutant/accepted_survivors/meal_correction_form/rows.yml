- subject: MealCorrectionForm::Rows.name_of
  kind: same-answer
  why: >-
    The resident is loaded from the database, and residents.name is NOT NULL, so it is always a String.
    `to_s` and `to_str` on a String return the same text as the String itself.
  diff: |
    @@ -1,3 +1,3 @@
     def self.name_of(resident)
    -  T.must(resident).name.to_s
    +  T.must(resident).name.to_str
     end

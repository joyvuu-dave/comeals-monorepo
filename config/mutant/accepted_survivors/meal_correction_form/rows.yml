- subject: MealCorrectionForm::Rows#seen
  kind: same-answer
  why: >-
    ActiveSupport changes BigDecimal#to_s so that with no format it uses "F", the same as `to_s("F")`. The
    new example that pins the exact digest passes with this change.
  diff: |
    @@ -1,9 +1,9 @@
     def seen
       Digest::SHA256.hexdigest([bills.map { |bill|
    -    [bill.resident_id, T.must(bill.amount).to_s("F"), bill.no_cost]
    +    [bill.resident_id, T.must(bill.amount).to_s, bill.no_cost]
       }, eaters.map { |row|
         [row.resident_id, row.multiplier]
       }, guests.map { |guest|
         [guest.id, guest.resident_id, guest.multiplier]
       }].to_json)
     end
- subject: MealCorrectionForm::Rows#seen
  kind: same-answer
  why: >-
    ActiveSupport writes a BigDecimal to JSON as the text of `to_s`, which with no format is the "F" form
    ("30.0"). So `to_json` writes the same text for the BigDecimal as for `to_s("F")`, and the new example
    that pins the exact digest passes with this change.
  diff: |
    @@ -1,9 +1,9 @@
     def seen
       Digest::SHA256.hexdigest([bills.map { |bill|
    -    [bill.resident_id, T.must(bill.amount).to_s("F"), bill.no_cost]
    +    [bill.resident_id, T.must(bill.amount), bill.no_cost]
       }, eaters.map { |row|
         [row.resident_id, row.multiplier]
       }, guests.map { |guest|
         [guest.id, guest.resident_id, guest.multiplier]
       }].to_json)
     end

- subject: ProfileUpdate.read_children
  kind: same-answer
  why: >-
    Rails turns each JSON object in a request into an `ActionController::Parameters`,
    never an object of a subclass of it, so `is_a?` and `instance_of?` give the same
    answer.
  diff: |
    @@ -1,24 +1,24 @@
     def self.read_children(raw)
       if raw.nil?
         return []
       end
       unless raw.is_a?(Array)
         return "Children must be a list."
       end
       children = raw.map { |child|
    -    unless child.is_a?(ActionController::Parameters)
    +    unless child.instance_of?(ActionController::Parameters)
           return "Each child must have an id, a name and a vegetarian setting."
         end
         id = whole_number(child[:id])
         vegetarian = TrueOrFalse.read(child[:vegetarian])
         name = child[:name]
         if id.nil? || vegetarian.nil? || !name.is_a?(String)
           return "Each child must have an id, a name and a vegetarian setting."
         end
         Child.new(id:, name:, vegetarian:)
       }
       if children.map(&:id).uniq.size < children.size
         return "Each child can be sent only once."
       end
       children
     end

    @@ -1,9 +1,8 @@
     def self.whole_number(raw)
       if raw.is_a?(Integer)
         return raw
       end
       if raw.is_a?(String) && raw.match?(/\A\d+\z/)
         return raw.to_i
       end
    -  nil
     end

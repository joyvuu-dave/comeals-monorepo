  diff: |
    @@ -1,21 +1,19 @@
     def self.save_all(resident, children)
       reasons = if resident.save
         []
       else
         resident.errors.full_messages
       end
       children.each { |child|
         if child.save
           next
         end
         before = child.attribute_in_database(:name)
         reasons.concat(child.errors.full_messages.map { |reason|
           "#{before}: #{reason}"
         })
       }
    -  if reasons.empty?
    -    nil
    -  else
    +  unless reasons.empty?
         reasons.join("\n")
       end
     end
- subject: ProfileUpdate.save_all
  kind: same-answer
  why: >-
    After a save that worked, `child.errors` is empty, so the lines after the `next`
    add nothing to `reasons`. Reading `attribute_in_database` changes nothing.
  diff: |
    @@ -1,21 +1,21 @@
     def self.save_all(resident, children)
       reasons = if resident.save
         []
       else
         resident.errors.full_messages
       end
       children.each { |child|
         if child.save
    -      next
    +      nil
         end
         before = child.attribute_in_database(:name)
         reasons.concat(child.errors.full_messages.map { |reason|
           "#{before}: #{reason}"
         })
       }
       if reasons.empty?
         nil
       else
         reasons.join("\n")
       end
     end
- subject: ProfileUpdate.read
  kind: same-answer
  why: >-
    A JSON value in a request that is text is a plain String, never an object of a
    subclass of String, so `is_a?(String)` and `instance_of?(String)` give the same
    answer.
  diff: |
    @@ -1,21 +1,21 @@
     def self.read(params)
       problems = []
    -  unless params[:name].is_a?(String)
    +  unless params[:name].instance_of?(String)
         problems << "Name must be text."
       end
       unless params[:email].is_a?(String)
         problems << "Email must be text."
       end
       vegetarian = TrueOrFalse.read(params[:vegetarian])
       if vegetarian.nil?
         problems << "#{TrueOrFalse.refusal(:vegetarian)}."
       end
       children = read_children(params[:children])
       if children.is_a?(String)
         problems << children
       end
       if problems.any?
         return problems.join("\n")
       end
       Fields.new(name: params[:name], vegetarian: T.must(vegetarian), email: params[:email], children: T.cast(children, T::Array[Child]))
     end

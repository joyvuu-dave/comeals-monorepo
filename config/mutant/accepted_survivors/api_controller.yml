- subject: ApiController#resolve_current_session
  kind: same-answer
  why: A ternary with no nil branch, `if token` with no else, gives nil when token is nil, the same value.
  diff: |
    @@ -1,19 +1,17 @@
     def resolve_current_session
       if defined?(@session_resolved)
         return
       end
       @session_resolved = true
       token = bearer_token_from_header || token_param
       if (login = JwtAuth.authenticate(token))
         @current_api_key = nil
         @current_login = T.let(login, T.nilable(JwtAuth::Login))
         return
       end
       key = if token
         Key.find_by(token:)
    -  else
    -    nil
       end
       @current_api_key = key
       @current_login = key&.identity
     end
- subject: ApiController#token_param
  kind: same-answer
  why: >-
    params[:token] comes from Rack's query parser or the JSON parser, which give a plain String, never a subclass,
    so instance_of? and is_a? agree.
  diff: |
    @@ -1,6 +1,6 @@
     def token_param
       token = params[:token]
    -  if token.is_a?(String)
    +  if token.instance_of?(String)
         token.presence
       end
     end
- subject: ApiController#current_resident_api
  kind: same-answer
  why: >-
    current_login answers a Resident, a CommonHouseLogin or nil. Nothing in app/ or lib/ subclasses Resident, so
    instance_of? and is_a? agree.
  diff: |
    @@ -1,6 +1,6 @@
     def current_resident_api
       login = current_login
    -  if login.is_a?(Resident)
    +  if login.instance_of?(Resident)
         login
       end
     end

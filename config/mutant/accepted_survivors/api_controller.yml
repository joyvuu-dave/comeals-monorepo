- subject: ApiController#resolve_current_session
  kind: same-answer
  why: >-
    The guard on the first line lets this code run once per controller, so @current_api_key has not been set before
    this line, and Ruby reads an unset instance variable as nil.
  diff: |
    @@ -1,19 +1,18 @@
     def resolve_current_session
       if defined?(@session_resolved)
         return
       end
       @session_resolved = true
       token = bearer_token_from_header || token_param
       if (login = JwtAuth.authenticate(token))
    -    @current_api_key = nil
         @current_login = T.let(login, T.nilable(JwtAuth::Login))
         return
       end
       key = if token
         Key.find_by(token:)
       else
         nil
       end
       @current_api_key = key
       @current_login = key&.identity
     end

---
- subject: ApiController#parse_start_end_params
  kind: same-answer
  why: >-
    parse_start_end_params answers a plain Hash or one of the two message constants INVALID_DATE and PICK_BOTH_TIMES,
    which are plain Strings. Neither is a subclass of String, so instance_of? and is_a? agree.
  diff: |
    @@ -1,12 +1,12 @@
     def parse_start_end_params(allday: false)
       times = start_end_times(allday)
    -  if times.is_a?(String)
    +  if times.instance_of?(String)
         return times
       end
       unless times.values.compact.all? { |time|
         StorableTime.timestamp?(time)
       }
         return INVALID_DATE
       end
       times
     end
- subject: ApiController#updated_start_end
  kind: same-answer
  why: >-
    Both callers (the event and common house update actions) pass the answer as **times, and Ruby 3.4 and later
    read **nil as no keywords, the same as **{}. The String check before that is false for both.
  diff: |
    @@ -1,12 +1,12 @@
     def updated_start_end(record, allday: false, more_keys: [])
       if (START_END_KEYS + more_keys).none? { |key|
         params.key?(key)
       }
    -    return {}
    +    return nil
       end
       times = parse_start_end_params(allday:)
       if times.is_a?(String)
         return times
       end
       stored_times_if_shown(record, times)
     end

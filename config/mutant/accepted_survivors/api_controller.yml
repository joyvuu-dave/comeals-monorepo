- subject: ApiController#sent_fields
  kind: same-answer
  why: keys.select keeps only the keys for which params.key? is true, so fetch never raises.
  diff: |
    @@ -1,7 +1,7 @@
     def sent_fields(*keys)
       keys.select { |key|
         params.key?(key)
       }.index_with { |key|
    -    params[key]
    +    params.fetch(key)
       }
     end
- subject: ApiController#start_end_times
  kind: same-answer
  why: >-
    Date.valid_date? on the next line refuses a month of 0 or 13, and any month above 12, the same as whole_number_param
    refusing it (nil). Both answer INVALID_DATE.
  diff: |
    @@ -1,21 +1,21 @@
     def start_end_times(allday)
       year = whole_number_param(:start_year)
    -  month = whole_number_param(:start_month, 1..12)
    +  month = whole_number_param(:start_month, 0..12)
       day = whole_number_param(:start_day, 1..31)
       unless Date.valid_date?(year, month, day, Date::GREGORIAN)
         return INVALID_DATE
       end
       midnight = Time.zone.local(year, month, day)
       if allday
         return { start_date: midnight, end_date: nil }
       end
       start_empty = empty_time?(:start_hours, :start_minutes)
       end_empty = empty_time?(:end_hours, :end_minutes)
       if start_empty && end_empty
         return { start_date: midnight, end_date: midnight }
       end
       if start_empty || end_empty
         return PICK_BOTH_TIMES
       end
       timed_start_end(year, month, day)
     end

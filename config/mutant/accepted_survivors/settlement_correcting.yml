- subject: SettlementCorrecting#keep_old_ledger!
  kind: same-answer
  why: "Nothing reads comeals.settling after this step today: clear_ledger! only deletes, the triggers that read the setting check inserts only, and write_ledger! and record_lines! each set it before they insert and clear it after. A failed step rolls the setting back with its savepoint. The line stays so a later step that inserts without setting it first cannot see a value left from this one."

- subject: SettlementCorrecting#run_fix
  kind: same-answer
  why: >-
    T.unsafe returns its argument as it is. It only tells Sorbet not to check
    the type, so unless ended and unless T.unsafe(ended) do the same thing.
  diff: |
    @@ -1,18 +1,18 @@
     def run_fix(fix)
       if fix.nil?
         return
       end
       ended = T.let(false, T::Boolean)

       begin
         fix.call
         ended = true
       rescue Exception
         ended = true
         raise
       ensure
    -    unless T.unsafe(ended)
    +    unless ended
           raise(Settlement::FixLeftEarly, "The fix block was left by return, break or throw. Nothing was written: the fix and the " "correction stay together or not at all.")
         end
       end
     end

- subject: SettlementCorrecting#keep_old_ledger!
  kind: same-answer
  why: >-
    squish only joins the lines of the SQL into one line. PostgreSQL reads
    newlines and spaces between words the same way, so it runs the same
    INSERT.
  diff: |
    @@ -1,18 +1,18 @@
     def keep_old_ledger!(reason, include_earlier_differences, earlier)
       write_settling_setting(T.must(reconciliation.id).to_s)
       correction = reconciliation.settlement_corrections.create!(reason:, include_earlier_differences:, earlier_differences: earlier)
       binds = { correction: correction.id, at: correction.created_at, reconciliation: reconciliation.id }
    -  Reconciliation.connection.execute(Reconciliation.sanitize_sql_array([<<-HEREDOC.squish, binds]))
    +  Reconciliation.connection.execute(Reconciliation.sanitize_sql_array([<<-HEREDOC, binds]))
     INSERT INTO settlement_correction_charges
       (settlement_correction_id, meal_charge_id, meal_id, resident_id, kind, amount, multiplier, unit_cost,
        bill_amount, charged_at, created_at, updated_at)
     SELECT :correction, meal_charges.id, meal_charges.meal_id, meal_charges.resident_id, meal_charges.kind,
            meal_charges.amount, meal_charges.multiplier, meal_charges.unit_cost, meal_charges.bill_amount,
            meal_charges.created_at, :at, :at
     FROM meal_charges JOIN meals ON meals.id = meal_charges.meal_id
     WHERE meals.reconciliation_id = :reconciliation
     ORDER BY meal_charges.id
     HEREDOC
       write_settling_setting("")
       correction
     end


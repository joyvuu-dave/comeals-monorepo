- subject: SettlementCorrecting#refuse_a_marked_settlement!
  kind: same-answer
  why: >-
    Rails turns a record in a where hash into its id, so reconciliation_id:
    reconciliation gives the same SQL as reconciliation_id: reconciliation.id.
  diff: |
    @@ -1,7 +1,7 @@
     def refuse_a_marked_settlement!
    -  marked = SettlementLineMark.joins(:reconciliation_balance).where(reconciliation_balances: { reconciliation_id: reconciliation.id })
    +  marked = SettlementLineMark.joins(:reconciliation_balance).where(reconciliation_balances: { reconciliation_id: reconciliation })
       unless marked.exists?
         return
       end
       raise(Settlement::Marked, "Refused: settlement #{reconciliation.id} has lines marked Paid or Let go, so people have paid " "from it and its numbers stay what they were. Correct the dinner instead; the next settlement " "carries it (ADR 0011 rule 6). Nothing was written.")
     end


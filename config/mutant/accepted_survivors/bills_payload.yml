    -      edit.change_seen(bill, resident_of(edit).name.to_s)
    +      edit.change_seen(bill, resident_of(edit).name)
         end
       }
       if changes.any?
         return stale(changes)
       end
       @edits.each { |edit|
         bill = stored[T.must(edit.resident_id)]
         unless edit.done?(bill)

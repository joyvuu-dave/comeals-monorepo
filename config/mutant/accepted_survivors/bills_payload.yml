- subject: BillsPayload#sides
  kind: same-answer
  why: >-
    ActiveSupport changes BigDecimal#to_s so that with no format it uses "F", the same as `to_s("F")`. So
    the amounts are written the same way, and the digest is the same.
  diff: |
    @@ -1,5 +1,5 @@
     def sides(edit)
       [edit.from, edit.to].map { |side|
    -    side && [side.amount.to_s("F"), side.no_cost]
    +    side && [side.amount.to_s, side.no_cost]
       }
     end
- subject: BillsPayload#sides
  kind: same-answer
  why: >-
    ActiveSupport writes a BigDecimal to JSON as the text of `to_s`, which with no format is the "F" form
    ("5.0"). So JSON.generate writes the same text for the BigDecimal as for `to_s("F")`, and the digest is
    the same.
  diff: |
    @@ -1,5 +1,5 @@
     def sides(edit)
       [edit.from, edit.to].map { |side|
    -    side && [side.amount.to_s("F"), side.no_cost]
    +    side && [side.amount, side.no_cost]
       }
     end
- subject: BillsPayload#check
  kind: same-answer
  why: >-
    `raw` is `params[:edits]` from ActionController::Parameters, which gives a list as a plain Array, never
    a subclass, so `is_a?(Array)` and `instance_of?(Array)` give the same answer.
  diff: |
    @@ -1,15 +1,15 @@
     def check(raw)
    -  unless raw.is_a?(Array) && raw.all? { |item|
    +  unless raw.instance_of?(Array) && raw.all? { |item|
         item.respond_to?(:key?)
       }
         return "edits must be a list of changes."
       end
       raw.each { |item|
         parsed = edit(item)
         if parsed.is_a?(String)
           return parsed
         end
         @edits << parsed
       }
       duplicate_cook || unknown_cook
     end
- subject: BillsPayload#check
  kind: same-answer
  why: >-
    `edit` returns an Edit or a sentence. Every sentence is a plain String (a String literal,
    Bill::NO_COST_MEANS_NO_AMOUNT, or TrueOrFalse.refusal), never a subclass, so `is_a?` and `instance_of?`
    give the same answer.
  diff: |
    @@ -1,15 +1,15 @@
     def check(raw)
       unless raw.is_a?(Array) && raw.all? { |item|
         item.respond_to?(:key?)
       }
         return "edits must be a list of changes."
       end
       raw.each { |item|
         parsed = edit(item)
    -    if parsed.is_a?(String)
    +    if parsed.instance_of?(String)
           return parsed
         end
         @edits << parsed
       }
       duplicate_cook || unknown_cook
     end

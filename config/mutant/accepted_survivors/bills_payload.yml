       else
         check(params[:edits])
       end, T.nilable(String))
     end
- subject: BillsPayload#fingerprint
  kind: same-answer
  why: >-
    T::Enum answers to_json with its serialized value, so JSON.generate writes the op as "add", "change" or
    "remove" either way. The existing example that pins the exact digest passes with this change.
  diff: |
    @@ -1,5 +1,5 @@
     def fingerprint
       Digest::SHA256.hexdigest(JSON.generate(@edits.map { |edit|
    -    [edit.op.serialize, edit.resident_id, *sides(edit)]
    +    [edit.op, edit.resident_id, *sides(edit)]
       }))
     end

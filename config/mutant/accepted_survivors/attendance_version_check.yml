---
- subject: AttendanceVersionCheck#attendance_write
  kind: same-answer
  why: >-
    stored and expected are both Integers here (AttendanceVersion.of and AttendanceVersionParam). Two equal Integers
    below 2**62 are the same object, and a stored version is a count of writes to one row, far below that. A larger
    expected is not equal to stored either way.
  diff: |
    @@ -1,16 +1,16 @@
     def attendance_write(&blk)
       expected = AttendanceVersionParam.from_params(params)
       if expected.is_a?(String)
         return render_refused(expected)
       end
       render_write_under_lock {
         if expected.nil?
           next yield(@meal_resident)
         end
         stored = attendance_version_now
    -    if stored != expected
    +    if !stored.equal?(expected)
           next stale_attendance_rejection(stored)
         end
         yield(meal.meal_residents.find_by(resident_id: params[:resident_id]))
       }
     end

- subject: ClosedMealAttendanceFreeze#attendees_in_database
  kind: same-answer
  why: >-
    Each `where` is a relation that is not loaded. On such a relation
    `size` runs the same `SELECT COUNT(*)` as `count`.
  diff: |
    @@ -1,3 +1,3 @@

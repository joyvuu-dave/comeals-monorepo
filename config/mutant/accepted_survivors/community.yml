- subject: Community#normalize_schedule_week
  kind: same-answer
  why: >-
    After `Integer(..., exception: false)` each item is an Integer or nil.
    `all?` with no argument is false only when an item is nil (0 is true
    in Ruby), and `all?(Integer)` is false only for an item that is not an
    Integer, which here means nil. So both give the same answer.
  diff: |
    @@ -1,12 +1,12 @@
     def normalize_schedule_week(week)
       days = week.reject { |day|
         day.to_s.strip.empty?
       }.map { |day|
         Integer(day.to_s, exception: false)
       }.uniq
    -  if days.all?(Integer)
    +  if days.all?
         days.sort
       else
         days
       end
     end


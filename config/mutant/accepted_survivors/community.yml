- subject: Community#dinner_start_at
  kind: same-answer
  why: >-
    Without `to_i` the hour and minute stay Strings, like "18" and "05".
    `TimeZone#local` passes them to `Time.utc`, which reads a String of
    digits as the same number. Checked for every time from 00:00 to 23:59:
    the same instant.
  diff: |
    @@ -1,4 +1,4 @@
     def dinner_start_at(date)
    -  (hour, minute) = dinner_start_time_on(date).split(":").map(&:to_i)
    +  (hour, minute) = dinner_start_time_on(date).split(":")
       ActiveSupport::TimeZone[timezone].local(date.year, date.month, date.day, hour, minute)
     end


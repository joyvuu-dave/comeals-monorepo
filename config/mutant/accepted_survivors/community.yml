- subject: Community#unreconciled_ave_cost
  kind: same-answer
  why: >-
    With no start value, `sum` adds the costs to the Integer 0. Each
    `effective_cost` is a BigDecimal (its type in MealLedger), and 0 plus
    a BigDecimal is the same BigDecimal, so the total is the same.
  diff: |
    @@ -1,13 +1,13 @@
     def unreconciled_ave_cost
       final = averaged_meals.preload(:meal_residents, :guests).to_a
       total_multiplier = final.sum(&:multiplier)
       if total_multiplier.zero?
         return "--"
       end
       ledger = MealLedger.new(final)
    -  total_cost = final.sum(BigDecimal("0")) { |meal|
    +  total_cost = final.sum { |meal|
         ledger.summary_for(meal).effective_cost
       }
       val = Multiplier::FULL * (total_cost / total_multiplier)
       "$#{ActiveSupport::NumberHelper.number_to_rounded(val, precision: 2)}/adult"
     end

- subject: Community#unreconciled_ave_cost
  kind: same-answer
  why: >-
    On an ActiveRecord relation, `to_a` is another name for `to_ary`: both
    load the records and return the same Array.
  diff: |
    @@ -1,13 +1,13 @@
     def unreconciled_ave_cost
    -  final = averaged_meals.preload(:meal_residents, :guests).to_a
    +  final = averaged_meals.preload(:meal_residents, :guests).to_ary
       total_multiplier = final.sum(&:multiplier)
       if total_multiplier.zero?
         return "--"
       end
       ledger = MealLedger.new(final)
       total_cost = final.sum(BigDecimal("0")) { |meal|
         ledger.summary_for(meal).effective_cost
       }
       val = Multiplier::FULL * (total_cost / total_multiplier)
       "$#{ActiveSupport::NumberHelper.number_to_rounded(val, precision: 2)}/adult"
     end


- subject: MealSchedule#initialize
  kind: same-answer
  why: >-
    The one caller, `Community#meal_schedule`, passes `schedule`, a plain
    Array from the jsonb column or from `schedule=`; specs pass Array
    literals. Only a subclass gives a different answer for `is_a?` and
    `instance_of?`, and nothing in the app or its gems makes a subclass of
    Array, String or Integer that reaches this code.
  diff: |
    @@ -1,9 +1,9 @@
     def initialize(weeks:)
    -  unless weeks.is_a?(Array) && weeks.length.between?(1, MAX_WEEKS)
    +  unless weeks.instance_of?(Array) && weeks.length.between?(1, MAX_WEEKS)
         raise(ArgumentError, "cycle must be 1 to #{MAX_WEEKS} weeks, got #{weeks.inspect}")
       end
       if weeks.flatten.empty?
         raise(ArgumentError, "schedule has no meal days")
       end
       @weeks = weeks
     end

- subject: MealSchedule.weeks_since_epoch
  kind: same-answer
  why: >-
    `date.to_date - EPOCH` is a Rational with denominator 1, a whole
    number of days. `to_i` and `to_int` give the same Integer for it.
  diff: |
    @@ -1,3 +1,3 @@
     def self.weeks_since_epoch(date)
    -  (date.to_date - EPOCH).to_i / 7
    +  (date.to_date - EPOCH).to_int / 7
     end

- subject: MealSchedule.weeks_since_epoch
  kind: same-answer
  why: >-
    `date.to_date - EPOCH` is a Rational with denominator 1, a whole

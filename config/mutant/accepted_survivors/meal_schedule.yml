- subject: MealSchedule#upcoming_dates
  kind: never-ends
  why: >-
    With the loop body removed, `dates` never grows, so `while
    dates.length < count` never ends for a count above 0. Nothing is
    called inside the loop, so no example can stop it with an error of its
    own.
  diff: |
    @@ -1,17 +1,9 @@
     def upcoming_dates(from:, count:)
       dates = []
       date = from.to_date
       scan_limit = (count * cycle_length * 7) + 366
       scanned = 0
       while dates.length < count
    -    if scanned > scan_limit
    -      raise("Scanned #{scanned} days from #{from} and found only #{dates.length} of " "#{count} meal days — the schedule #{weeks.inspect} looks broken")
    -    end
    -    if meal_day?(date) && !Holidays.holiday?(date)
    -      dates << date
    -    end
    -    date = date.tomorrow
    -    scanned += 1
       end
       dates
     end

  diff: |
    @@ -1,3 +1,3 @@
     def self.weeks_since_epoch(date)
    -  (date.to_date - EPOCH).to_i / 7
    +  Integer((date.to_date - EPOCH)) / 7
     end

- subject: MealSchedule#meal_day?
  kind: same-answer
  why: >-
    `week_index` is `weeks_since_epoch(date) % cycle_length`, and
    `cycle_length` is the number of weeks, so the index is always from 0
    to the last week. `[]`, `at` and `fetch` give the same week.
  diff: |
    @@ -1,3 +1,3 @@
     def meal_day?(date)
    -  weeks[week_index(date)].include?(date.wday)
    +  weeks.fetch(week_index(date)).include?(date.wday)
     end


- subject: MealCostSummary.from_charges
  kind: same-answer
  why: >-
    On an ActiveRecord association, to_ary is the same method as to_a. Both
    load the records and return the same Array.
  diff: |
    @@ -1,13 +1,13 @@
     def self.from_charges(meal)
    -  charges = meal.meal_charges.to_a
    +  charges = meal.meal_charges.to_ary
       first = charges.first
       if first.nil?
         return chargeless(meal)
       end
       credits = charges.select(&:credit?)
       MealLedger::Summary.new(total_cost: credits.sum(BigDecimal("0")) { |credit|
         T.must(credit.bill_amount)
       }, effective_cost: credits.sum(BigDecimal("0")) { |credit|
         T.must(credit.amount)
       }, unit_cost: T.must(first.unit_cost), subsidized: charges.any?(&:subsidized?))
     end
- subject: MealCostSummary.now
  kind: same-answer
  why: "summary_for reads only the meal it is given. The list given to MealLedger.new is read only by #lines and the totals, which this does not call, so an empty list or a list holding nil gives the same summary."
  diff: |
    @@ -1,6 +1,6 @@
     def self.now(meal)
       unless meal.reconciled? && meal.meal_corrections.any?
         return self.for(meal)
       end
    -  MealLedger.new([meal]).summary_for(meal)
    +  MealLedger.new([]).summary_for(meal)
     end

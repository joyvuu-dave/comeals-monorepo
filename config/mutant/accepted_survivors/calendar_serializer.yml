     end
- subject: CalendarSerializer#rotations_in_range
  kind: same-answer
  why: "Relation#to_ary is the same as Relation#to_a: both load the records and give the Array."
  diff: |
    @@ -1,4 +1,4 @@
     def rotations_in_range(community)

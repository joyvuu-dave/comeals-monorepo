- subject: CalendarSerializer#events_in_range
  kind: same-answer
  why: >-
    An event that starts exactly at window_start also matches the first clause (start_date from window_start to
    window_end), so adding it to the third clause finds no new row.
  diff: |
    @@ -1,3 +1,3 @@
     def events_in_range(community)
    -  community.events.where(start_date: window_start..).where(start_date: ..window_end).or(community.events.where(end_date: window_start..).where(end_date: ..window_end)).or(community.events.where(start_date: ...window_start).where("end_date > ?", window_end)).order(:id)
    +  community.events.where(start_date: window_start..).where(start_date: ..window_end).or(community.events.where(end_date: window_start..).where(end_date: ..window_end)).or(community.events.where(start_date: ..window_start).where("end_date > ?", window_end)).order(:id)
     end
- subject: CalendarSerializer#window_start
  kind: same-answer
  why: >-
    start_date is YYYY-MM-DD, and Time.zone.parse of a date with no time gives that day's first instant, which is
    what beginning_of_day gives. The 2026-10-16 round in docs/mutation-testing.md checked this for every zone Rails
    lists, every day from 1970 to 2039.
  diff: |
    @@ -1,3 +1,3 @@
     def window_start
    -  Time.zone.parse(start_date).beginning_of_day
    +  Time.zone.parse(start_date)
     end

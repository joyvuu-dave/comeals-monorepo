- subject: SquashedMigrationsCheck.recorded_versions
  kind: same-answer
  why: >-
    Rails writes this INSERT only when there is at least one version, so there is always text between VALUES
    and the `;`, and `.+?` stops at the same `;` as `.*?`.
  diff: |
    @@ -1,9 +1,9 @@
     def self.recorded_versions(text)
    -  list = text[/^INSERT INTO "schema_migrations" \(version\) VALUES\n(.*?);$/m, 1]
    +  list = text[/^INSERT INTO "schema_migrations" \(version\) VALUES\n(.+?);$/m, 1]
       if list.nil?
         raise(ArgumentError, "#{STRUCTURE_FILE} has no INSERT INTO schema_migrations list")
       end
       list.scan(/'(\d+)'/).flatten.map {
         Integer(it, 10)
       }
     end
- subject: SquashedMigrationsCheck.recorded_versions
  kind: same-answer
  why: >-
    The whole match adds only the words before the list (INSERT INTO "schema_migrations" (version) VALUES)
    and the `;` after it. Neither holds a number in single quotes, so the scan for `'(\d+)'` finds the same
    versions.
  diff: |
    @@ -1,9 +1,9 @@
     def self.recorded_versions(text)
    -  list = text[/^INSERT INTO "schema_migrations" \(version\) VALUES\n(.*?);$/m, 1]
    +  list = text[/^INSERT INTO "schema_migrations" \(version\) VALUES\n(.*?);$/m, 0]
       if list.nil?
         raise(ArgumentError, "#{STRUCTURE_FILE} has no INSERT INTO schema_migrations list")
       end
       list.scan(/'(\d+)'/).flatten.map {
         Integer(it, 10)
       }
     end

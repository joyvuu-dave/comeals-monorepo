- subject: SquashedMigrationsCheck.problem
  kind: same-answer
  why: >-
    `unless tables.empty?` with no `else` gives nil when the tables are empty and `not_new(tables)`
    otherwise, the same as the `if`/`else` it replaces.
  diff: |
    @@ -1,20 +1,18 @@
     def self.problem(database:, squashed:, recorded:, tables:)
       newest = database.max
       if newest.nil?
    -    return (if tables.empty?
    -      nil
    -    else
    +    return (unless tables.empty?
           not_new(tables)
         end)
       end
       if newest < squashed
         return behind(newest:, squashed:)
       end
       missing = (recorded.select {
         it <= squashed
       } - database).sort
       if missing.empty?
         return nil
       end
       gap(missing:, squashed:)
     end

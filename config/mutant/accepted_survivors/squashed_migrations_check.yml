- subject: SquashedMigrationsCheck.verify!
  kind: same-answer
  why: >-
    `database` is `schema_migration.integer_versions`, which Rails reads in order of the version text. Every
    version in this app is a 14-digit timestamp, so the text order is the number order, and the last version
    is the largest.
  diff: |
    @@ -1,8 +1,8 @@
     def self.verify!
       database = database_versions
       reason = problem(database:, squashed: squashed_version(Rails.root.join(VERSION_FILE).read), recorded: recorded_versions(Rails.root.join(STRUCTURE_FILE).read), tables: ActiveRecord::Base.connection.tables)
       if reason
         raise(DatabaseBehind, reason)
       end
    -  database.max
    +  database.last
     end
- subject: SquashedMigrationsCheck.squashed_version
  kind: same-answer
  why: >-
    For any line, `strip`, `lstrip` and `rstrip` give an empty String exactly when the line holds only
    whitespace (null bytes too, checked on Ruby 4.0).
  diff: |
    @@ -1,9 +1,9 @@
     def self.squashed_version(text)
       versions = text.lines(chomp: true).reject { |line|
    -    line.start_with?("#") || line.strip.empty?
    +    line.start_with?("#") || line.lstrip.empty?
       }
       unless versions.size == 1
         raise(ArgumentError, "#{VERSION_FILE} must hold one version, not #{versions}")
       end
       Integer(versions.first, 10)
     end

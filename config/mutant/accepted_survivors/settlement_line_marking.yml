- subject: SettlementLineMarking.mark!
  kind: same-answer
  why: >-
    Rails turns a record in a where hash into its id, so
    reconciliation_balance_id: line gives the same SQL as
    reconciliation_balance_id: line.id.
  diff: |
    @@ -1,15 +1,15 @@
     def self.mark!(line, status:, note:, by:, seen:)
       RetryOnConflict.call {
         ReconciliationBalance.transaction {
           line.lock!
    -      newest = SettlementLineMark.where(reconciliation_balance_id: line.id).last
    +      newest = SettlementLineMark.where(reconciliation_balance_id: line).last
           if newest&.id != seen
             raise(Changed, "Someone changed this line's mark after the page was loaded, so nothing was saved. " "This is the page as it is now.")
           end
           mark = SettlementLineMark.new(reconciliation_balance: line, status:, note:, admin_user: by)
           refuse_no_change!(newest, mark)
           mark.save!
           mark
         }
       }
     end

- subject: SettlementLineMarking.mark!
  kind: same-answer
  why: >-
    Mutant runs this as (newest&.id).eql?(seen). Both sides are an Integer id
    or nil. For those, eql? gives the same answer as ==, and nil.eql?(nil) is
    true, so the refusal happens in the same cases.
  diff: |
    @@ -1,15 +1,15 @@
     def self.mark!(line, status:, note:, by:, seen:)
       RetryOnConflict.call {
         ReconciliationBalance.transaction {
           line.lock!
           newest = SettlementLineMark.where(reconciliation_balance_id: line.id).last
    -      if newest&.id != seen
    +      if !newest&.id.eql?(seen)
             raise(Changed, "Someone changed this line's mark after the page was loaded, so nothing was saved. " "This is the page as it is now.")
           end
           mark = SettlementLineMark.new(reconciliation_balance: line, status:, note:, admin_user: by)
           refuse_no_change!(newest, mark)
           mark.save!
           mark
         }
       }
     end

- subject: SettlementLineMarking.mark!
  kind: same-answer
  why: >-
    Mutant runs this as (newest&.id).equal?(seen). Both sides are an Integer
    id or nil. Ruby keeps one object for nil and for each Integer of this
    size, so equal? gives the same answer as ==.

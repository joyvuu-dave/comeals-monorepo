- subject: MealCorrecting::Edits#cost
  kind: same-answer
  why: >-
    Rails turns a record given as a `find_by` value into its id, so a record and its `.id` run the same SQL
    and find the same row.
  diff: |
    @@ -1,12 +1,12 @@
     def cost(cook, amount:, no_cost:)
    -  bill = Bill.find_by(meal_id: @meal.id, resident_id: cook.id)
    +  bill = Bill.find_by(meal_id: @meal.id, resident_id: cook)
       if bill.nil?
         Bill.create!(meal: @meal, resident: cook, amount:, no_cost:)
         return record("cost", cook, nil, cost_of(amount, no_cost))
       end
       before = cost_of(T.must(bill.amount), T.must(bill.no_cost))
       bill.update!(amount:, no_cost:)
       if bill.saved_changes?
         record("cost", cook, before, cost_of(amount, no_cost))
       end
     end

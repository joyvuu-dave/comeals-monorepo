- subject: MealCorrecting::Edits#cost_of
  kind: same-answer
  why: >-
    ActiveSupport changes BigDecimal#to_s so that with no format it uses "F", the same as `to_s("F")`, so
    the recorded amount is the same text.
  diff: |
    @@ -1,3 +1,3 @@
     def cost_of(amount, no_cost)
    -  { "amount" => amount.to_s("F"), "no_cost" => no_cost }
    +  { "amount" => amount.to_s, "no_cost" => no_cost }
     end

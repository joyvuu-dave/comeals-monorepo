- subject: DinnerCancelling.cancel
  kind: same-answer
  why: >-
    On an ActiveRecord relation, to_ary is the same method as to_a. Both load
    the records, with the same FOR UPDATE lock, and return the same Array.
  diff: |
    @@ -1,16 +1,16 @@
     def self.cancel(meal_ids)
    -  meals = Meal.where(id: meal_ids).order(:id).lock.to_a
    +  meals = Meal.where(id: meal_ids).order(:id).lock.to_ary
       with_a_cook = Bill.where(meal_id: meals.map(&:id)).distinct.pluck(:meal_id).to_set
       cancelled = T.let([], T::Array[Meal])
       left_alone = T.let([], T::Array[LeftAlone])
       meals.each { |meal|
         reason = reason_to_leave(meal, with_a_cook)
         if reason
           left_alone << LeftAlone.new(meal:, reason:)
         else
           cancelled << meal
         end
       }
       cancelled.each(&:cancel!)
       Result.new(cancelled:, left_alone:, gone: meal_ids.size - meals.size)
     end


- subject: DinnerCancelling.cancel
  kind: same-answer
  why: >-
    with_a_cook is read only by with_a_cook.include?(meal.id) for the meals in
    this same list. Reading the meal ids of every bill, not just the bills of
    these meals, adds only ids that are never asked about, so every answer is
    the same.

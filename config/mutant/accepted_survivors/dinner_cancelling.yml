- subject: DinnerCancelling.cancel
  kind: same-answer
  why: >-
    each returns the list it was called on, so meals.each(&:id) is the list of
    meals. Rails turns records in a where hash into their ids, so the SQL is
    the same as with meals.map(&:id).
  diff: |
    @@ -1,16 +1,16 @@
     def self.cancel(meal_ids)
       meals = Meal.where(id: meal_ids).order(:id).lock.to_a
    -  with_a_cook = Bill.where(meal_id: meals.map(&:id)).distinct.pluck(:meal_id).to_set
    +  with_a_cook = Bill.where(meal_id: meals.each(&:id)).distinct.pluck(:meal_id).to_set
       cancelled = T.let([], T::Array[Meal])
       left_alone = T.let([], T::Array[LeftAlone])

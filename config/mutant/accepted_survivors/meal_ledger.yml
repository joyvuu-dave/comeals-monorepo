- subject: MealLedger#kind_rank
  kind: same-answer
  why: >-
    kind_rank is used only to compare an attendee with a guest of the same
    resident in eaters. 1 for a guest and -1 for an attendee still puts the
    guest after the attendee, so the order is the same.
  diff: |
    @@ -1,7 +1,7 @@
     def kind_rank(eater)
       if eater.is_a?(Guest)
         1
       else
    -    0
    +    -1
       end
     end


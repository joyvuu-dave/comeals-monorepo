- subject: MealLedger#kind_rank
  kind: same-answer
  why: >-
    kind_rank is given a MealResident or a Guest (its sig says so), and no
    class in app/ or lib/ inherits from Guest. So instance_of?(Guest) and
    is_a?(Guest) give the same answer.
  diff: |
    @@ -1,7 +1,7 @@
     def kind_rank(eater)
    -  if eater.is_a?(Guest)
    +  if eater.instance_of?(Guest)
         1
       else
         0
       end
     end

- subject: MealLedger#credit_lines
  kind: same-answer
  why: >-
    Line is a T::Struct, and multiplier is a T.nilable field. A T::Struct sets
    a nilable field that is left out to nil, so the Line is the same as with
    multiplier: nil.
  diff: |
    @@ -1,7 +1,7 @@
     def credit_lines(meal, bills, spent, financials)
       credits = credit_units(spent, financials)
       Array.new(bills.size) { |index|
         bill = T.must(bills[index])
    -    Line.new(meal_id: T.must(meal.id), resident_id: T.must(bill.resident_id), kind: :credit, amount: amount(T.must(credits[index])), multiplier: nil, unit_cost: financials.unit_cost, bill_amount: T.must(bill.amount))
    +    Line.new(meal_id: T.must(meal.id), resident_id: T.must(bill.resident_id), kind: :credit, amount: amount(T.must(credits[index])), unit_cost: financials.unit_cost, bill_amount: T.must(bill.amount))
       }
     end

- subject: MealLedger#debit_lines
  kind: same-answer
  why: >-
    Line is a T::Struct, and bill_amount is a T.nilable field. A T::Struct
    sets a nilable field that is left out to nil, so the Line is the same as
    with bill_amount: nil.
  diff: |
    @@ -1,18 +1,18 @@
     def debit_lines(meal, people, financials)
       weights = people.map { |eater|
         T.must(eater.multiplier)
       }
       shares = if financials.total_multiplier.zero?
         weights
       else
         LargestRemainderSplit.call(financials.effective_units, weights)
       end
       Array.new(people.size) { |index|
         eater = T.must(people[index])
         Line.new(meal_id: T.must(meal.id), resident_id: T.must(eater.resident_id), kind: if eater.is_a?(Guest)
           :guest_debit
         else
           :debit
    -    end, amount: amount(-T.must(shares[index])), multiplier: T.must(eater.multiplier), unit_cost: financials.unit_cost, bill_amount: nil)
    +    end, amount: amount(-T.must(shares[index])), multiplier: T.must(eater.multiplier), unit_cost: financials.unit_cost)
       }
     end


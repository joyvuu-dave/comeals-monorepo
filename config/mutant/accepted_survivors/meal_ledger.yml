- subject: MealLedger#initialize
  kind: same-answer
  why: >-
    Without the T.let line, @lines is not set, and Ruby reads an instance
    variable that was never set as nil. lines uses @lines ||= ..., so it
    builds the list the first time either way.
  diff: |
    @@ -1,4 +1,3 @@
     def initialize(meals)
       @meals = meals
    -  @lines = T.let(nil, T.nilable(T::Array[Line]))
     end

- subject: MealLedger.units
  kind: same-answer
  why: >-
    scaled has no fraction here: the line above raises when scaled.frac is not
    zero. For a BigDecimal with no fraction, Integer(scaled) and scaled.to_i
    give the same Integer.
  diff: |
    @@ -1,7 +1,7 @@
     def self.units(amount)
       scaled = amount * UNITS_PER_DOLLAR
       unless scaled.frac.zero?
         raise(ArgumentError, "#{amount.to_s("F")} is not a whole number of 10^-8 dollars")
       end
    -  scaled.to_i
    +  Integer(scaled)
     end

- subject: MealLedger.units
  kind: same-answer
  why: >-
    ActiveSupport changes BigDecimal#to_s so that with no argument it uses the
    'F' format, and #{amount} calls to_s with no argument. So the message has
    the same text.
  diff: |
    @@ -1,7 +1,7 @@
     def self.units(amount)
       scaled = amount * UNITS_PER_DOLLAR
       unless scaled.frac.zero?
    -    raise(ArgumentError, "#{amount.to_s("F")} is not a whole number of 10^-8 dollars")
    +    raise(ArgumentError, "#{amount} is not a whole number of 10^-8 dollars")
       end
       scaled.to_i
     end


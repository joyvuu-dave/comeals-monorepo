- subject: Rotation.recolor_community
  kind: same-answer
  why: >-
    The index is `index % COLORS.length`, so it is always from 0 to the
    last color. `[]`, `at` and `fetch` give the same color.
  diff: |
    @@ -1,12 +1,12 @@
     def self.recolor_community
       changed_rotation_ids = []
       Rotation.order(:id).each_with_index { |rotation, index|
    -    new_color = COLORS[index % COLORS.length]
    +    new_color = COLORS.fetch(index % COLORS.length)
         if rotation.color == new_color
           next
         end
         rotation.update!(color: new_color)
         changed_rotation_ids << rotation.id
       }
       changed_rotation_ids
     end

- subject: Rotation.recolor_community
  kind: same-answer
  why: >-
    Its one caller is `self.class.recolor_community` in a Rotation, and
    Rotation has no subclass, so `self` is Rotation here.
  diff: |

- subject: Rotation#set_place_value
  kind: same-answer
  why: >-
    Without `Arel.sql`, Rails accepts `MIN(meals.date) NULLS LAST` as it
    is, because a function of one column with NULLS LAST is on its list of
    safe order strings. So it does not raise, and the SQL is the same.
  diff: |
    @@ -1,14 +1,14 @@
     def set_place_value
       renumbered = []
    -  ordered = Rotation.left_joins(:meals).group("rotations.id").order(Arel.sql("MIN(meals.date) NULLS LAST"), :id).pluck(:id, :place_value)
    +  ordered = Rotation.left_joins(:meals).group("rotations.id").order("MIN(meals.date) NULLS LAST", :id).pluck(:id, :place_value)
       ordered.each_with_index { |(rot_id, place_value), index|
         if place_value == index.+(1)
           next
         end
         Rotation.where(id: rot_id).update_all(place_value: index + 1, updated_at: Time.current)
         renumbered << rot_id
       }
       Meal.where(rotation_id: renumbered).pluck(:date).each { |date|
         LiveUpdate.calendar(date)
       }
     end

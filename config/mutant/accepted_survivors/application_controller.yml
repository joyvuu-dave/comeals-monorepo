---
- subject: ApplicationController#current_admin_user_custom
  kind: same-answer
  why: >-
    ENV values are Strings, so .to_s changes nothing when READ_ONLY_ADMIN_ID is set. When it is not set, AdminUser.find(nil)
    and AdminUser.find('') both raise RecordNotFound.
  diff: |
    @@ -1,6 +1,6 @@
     def current_admin_user_custom
       if read_only_admin_token?
    -    return AdminUser.find(ENV.fetch("READ_ONLY_ADMIN_ID", nil).to_s)
    +    return AdminUser.find(ENV.fetch("READ_ONLY_ADMIN_ID", nil))
       end
       current_admin_user
     end
- subject: ApplicationController#read_only_admin_token?
  kind: same-answer
  why: This runs only after params[:token].present? is true, so the key is there and fetch never raises.
  diff: |
    @@ -1,3 +1,3 @@
     def read_only_admin_token?
    -  params[:token].present? && params[:token] == ENV["READ_ONLY_ADMIN_TOKEN"]
    +  params[:token].present? && params.fetch(:token) == ENV["READ_ONLY_ADMIN_TOKEN"]
     end

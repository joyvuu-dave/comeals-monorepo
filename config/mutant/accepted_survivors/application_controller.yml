- subject: ApplicationController#use_community_timezone
  kind: same-answer
  why: >-
    Time.use_zone(nil) keeps the zone that is current, so with no community zone the block runs in the app zone
    with or without the early return.
  diff: |
    @@ -1,7 +1,7 @@
     def use_community_timezone(&)
       zone = ActiveSupport::TimeZone[Community.first&.timezone.to_s]
    -  if zone.nil?
    +  if self.nil?
         return yield
       end
       Time.use_zone(zone, &)
     end

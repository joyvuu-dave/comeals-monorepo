- subject: RecurringCatchUp#tasks
  kind: same-answer
  why: >-
    Rails.application.config_for gives the entries of config/recurring.yml as plain Hashes; only the top
    level is an OrderedOptions. So `is_a?(Hash)` and `instance_of?(Hash)` give the same answer.
  diff: |
    @@ -1,6 +1,6 @@
     def tasks
       config = Rails.application.config_for(:recurring)
       config.values.select { |task|
    -    task.is_a?(Hash) && task[:class].present?
    +    task.instance_of?(Hash) && task[:class].present?
       }
     end

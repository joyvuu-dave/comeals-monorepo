- subject: RecurringCatchUp#enqueue
  kind: same-answer
  why: >-
    The job class comes from `constantize` on a class name in config/recurring.yml, so it is a named class,
    and for a named class `Class#to_s` returns its name.
  diff: |
    @@ -1,12 +1,12 @@
     def enqueue(job_class)
       if RetryOnConflict.call {
         job_class.perform_later
       }
         return true
       end
    -  report(RuntimeError.new("#{job_class.name} was not queued"), job_class.name)
    +  report(RuntimeError.new("#{job_class} was not queued"), job_class.name)
       false
     rescue StandardError => e
       report(e, job_class.name)
       false
     end
- subject: RecurringCatchUp#enqueue
  kind: same-answer
  why: >-
    `report` returns what `Rails.error.report` returns, which is nil (ActiveSupport::ErrorReporter #report
    ends with nil), and the rescue branch ends with nil too without the `false`. The only caller uses the
    answer inside `select`, where nil and false are the same.
  diff: |
    @@ -1,12 +1,11 @@
     def enqueue(job_class)
       if RetryOnConflict.call {
         job_class.perform_later
       }
         return true
       end
       report(RuntimeError.new("#{job_class.name} was not queued"), job_class.name)
       false
     rescue StandardError => e
       report(e, job_class.name)
    -  false
     end

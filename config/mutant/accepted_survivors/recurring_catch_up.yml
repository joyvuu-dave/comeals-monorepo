- subject: RecurringCatchUp#due
  kind: same-answer
  why: >-
    Every entry in config/recurring.yml that names a class also has a schedule (Solid Queue refuses an entry
    with none), so `fetch(:schedule)` finds the key and gives the same value as `[]`.
  diff: |
    @@ -1,18 +1,18 @@
     def due
       recurring = tasks.filter_map { |task|
         job_class = task[:class].constantize
         if job_class < RecurringJob
    -      [job_class, task[:schedule]]
    +      [job_class, task.fetch(:schedule)]
         end
       }
       last_successes = JobRun.last_success_at(recurring.map { |job_class, _schedule|
         job_class.run_name
       })
       recurring.filter_map { |job_class, schedule|
         last_tick = Fugit.parse(schedule).previous_time(@now).to_t
         last_success = last_successes[job_class.run_name]
         if last_success.nil? || last_success < last_tick
           job_class
         end
       }
     end

---
- subject: Api::V1::CommonHouseReservationsController#create
  kind: same-answer
  why: >-
    parse_start_end_params answers a plain Hash or one of the two message constants INVALID_DATE and PICK_BOTH_TIMES,
    which are plain Strings. Neither is a subclass of String, so instance_of? and is_a? agree.
  diff: |
    @@ -1,14 +1,14 @@
     def create
       times = parse_start_end_params
    -  if times.is_a?(String)
    +  if times.instance_of?(String)
         return render_refused(times)
       end
       chr = CommonHouseReservation.new(resident_id: params[:resident_id], start_date: times[:start_date], end_date: times[:end_date], title: params[:title])
       render_retrying_on_conflict {
         if chr.save
           { json: { message: "Common House Reservation has been created" } }
         else
           { json: { message: chr.errors.full_messages.join("\n") }, status: :bad_request }
         end
       }
     end

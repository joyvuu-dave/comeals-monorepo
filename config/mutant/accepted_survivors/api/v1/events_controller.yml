- subject: Api::V1::EventsController#set_resource
  kind: same-answer
  why: >-
    The route (/:id, /:id/update, /:id/delete) always has :id in its path, and a path value is always in params,
    so fetch never raises.
  diff: |
    @@ -1,6 +1,6 @@
     def set_resource
    -  @event = Event.find_by(id: params[:id])
    +  @event = Event.find_by(id: params.fetch(:id))
       if @event.blank?
         not_found_api
       end
     end

---
- subject: Api::V1::EventsController#create
  kind: same-answer
  why: >-
    TrueOrFalse.from_params answers a plain Hash or a String it builds with interpolation and join. Never a subclass
    of String, so instance_of? and is_a? agree.
  diff: |
    @@ -1,19 +1,19 @@
     def create
       flags = TrueOrFalse.from_params(params, [:all_day], required: false)
    -  if flags.is_a?(String)
    +  if flags.instance_of?(String)
         return render_refused(flags)
       end
       allday = flags.fetch(:all_day, false)
       times = parse_start_end_params(allday:)
       if times.is_a?(String)
         return render_refused(times)
       end
       event = Event.new(start_date: times[:start_date], end_date: times[:end_date], title: params[:title], description: params[:description] || "", allday:)
       render_retrying_on_conflict {
         if event.save
           { json: { message: "Event has been created" } }
         else
           { json: { message: event.errors.full_messages.join("\n") }, status: :bad_request }
         end
       }
     end

- subject: Api::V1::MealsController#set_meal
  kind: same-answer
  why: >-
    not_found_api has already rendered the 404. Without the return, note_live_update_sender also sets Current.socket_id
    and Current.push_token, and nothing reads them in a request that wrote nothing. PushToken.read never raises.
  diff: |
    @@ -1,7 +1,7 @@
     def set_meal
       @meal = T.let(Meal.includes(:bills, :meal_residents, :guests).find_by(id: params[:meal_id]), T.nilable(Meal))
       if @meal.nil?
    -    return not_found_api
    +    not_found_api
       end
       note_live_update_sender
     end

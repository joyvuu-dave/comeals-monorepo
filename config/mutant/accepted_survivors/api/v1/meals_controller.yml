- subject: Api::V1::MealsController#update_meal_resident
  kind: same-answer
  why: >-
    TrueOrFalse.from_params answers a plain Hash or a String it builds with interpolation and join. Never a subclass
    of String, so instance_of? and is_a? agree.
  diff: |
    @@ -1,13 +1,13 @@
     def update_meal_resident
       flags = TrueOrFalse.from_params(params, [:late, :vegetarian], required: false)
    -  if flags.is_a?(String)
    +  if flags.instance_of?(String)
         return render_refused(flags)
       end
       attendance_write { |row|
         if row.nil?
           next not_found_rendering
         end
         row.update!(flags)
         { json: { message: "MealResident updated.", attendance_version: attendance_version_now } }
       }
     end
- subject: Api::V1::MealsController#update_bills
  kind: same-answer
  why: >-
    e is an ActiveRecord::RecordNotFound. ActiveSupport writes an exception to JSON as its to_s, and RecordNotFound
    does not change message or to_s, so the JSON text is the same.
  diff: |
    @@ -1,27 +1,27 @@
     def update_bills
       payload = bills_payload
       if payload.outdated?
         return refuse_outdated_bills(payload)
       end
       header = bills_key_header
       key = header.key
       if key.nil?
         return render(json: { message: header.error }, status: :bad_request)
       end
       unless payload.valid?
         return render(json: { message: payload.error }, status: :bad_request)
       end
       render(**T.must(with_meal_lock(before_settled_check: ->() {
         seen_bills_key_answer
       }) {
         save_bills(payload, key)
       }))
     rescue ActiveRecord::RecordNotFound => e
    -  render(json: { message: e.message }, status: :bad_request)
    +  render(json: { message: e }, status: :bad_request)
     rescue ActiveRecord::RecordInvalid, ActiveRecord::RecordNotDestroyed => e
       render(json: { message: e.record.errors.full_messages.join("\n") }, status: :bad_request)
     rescue ActiveRecord::InvalidForeignKey
       render(json: { message: "Invalid cook assignment." }, status: :bad_request)
     rescue ActiveRecord::RangeError
       render(json: { message: "Invalid amount. Amounts are whole cents, 0 to 9999.99." }, status: :bad_request)
     end
- subject: Api::V1::MealsController#seen_bills_key_answer
  kind: same-answer
  why: Rails reads a record given for an id in a where hash as its id, so the query is the same.
  diff: |
    @@ -1,10 +1,10 @@
     def seen_bills_key_answer
       key = bills_key_header.key
       if key.nil? || !bills_payload.valid?
         return nil
       end
    -  seen = BillsSaveKey.find_by(meal_id: meal.id, key:)
    +  seen = BillsSaveKey.find_by(meal_id: meal, key:)
       if seen
         answer_seen_key(seen, bills_payload)
       end
     end

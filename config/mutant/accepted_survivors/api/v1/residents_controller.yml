- subject: Api::V1::ResidentsController#common_house_token
  kind: same-answer
  why: >-
    `password` is `params[:password]`. Text in a request is a plain String, never
    an object of a subclass of String, so `is_a?(String)` and `instance_of?(String)`
    give the same answer.
  diff: |
    @@ -1,12 +1,12 @@
     def common_house_token
       login = CommonHouseLogin.first
       if login.nil?
         return render(json: { message: COMMON_HOUSE_NOT_SET_UP }, status: :bad_request)
       end
       password = params[:password]
    -  unless password.is_a?(String) && login.authenticate(password)
    +  unless password.instance_of?(String) && login.authenticate(password)
         return render(json: { message: "Incorrect password" }, status: :bad_request)
       end
       community = Community.instance
       render(json: { token: JwtAuth.encode(login), community_id: community.id, timezone: community.timezone, username: CommonHouseLogin::NAME, common_house: true })
     end

- subject: Api::V1::ResidentsController#password_reset
  kind: same-answer
  why: >-
    The line before answered "Email required." for a blank `params[:email]`, so the
    key is there and `fetch` never raises.
  diff: |
    @@ -1,21 +1,21 @@
     def password_reset
       if params[:email].blank?
         render(json: { message: "Email required." }, status: :bad_request) and return
       end
    -  email = params[:email].to_s.strip.downcase
    +  email = params.fetch(:email).to_s.strip.downcase
       if email == CommonHouseLogin::EMAIL
         return render(json: { message: COMMON_HOUSE_PASSWORD_BY_ADMIN }, status: :bad_request)
       end
       resident = Resident.find_by(email:)
       if resident.nil?
         return render(json: { message: "No resident with that email address." }, status: :bad_request)
       end
       case PasswordReset.request(resident)
       when :sent
         render(json: { message: "Check your email." })
       when :mail_failed
         render(json: { message: "Password reset saved but email could not be sent. Please contact an administrator." }, status: :service_unavailable)
       else
         refuse_for_the_row(resident, "No reset link was sent:")
       end
     end

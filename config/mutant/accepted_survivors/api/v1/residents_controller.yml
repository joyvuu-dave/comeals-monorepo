---
- subject: Api::V1::ResidentsController#ical
  kind: same-answer
  why: >-
    goldiloader (in the Gemfile) loads the meal of every row in a batch with one query
    the first time the loop asks for a meal. So the loop reads the same meals with
    or without the `includes`, and the feed is the same.
  diff: |
    @@ -1,18 +1,18 @@
     def ical
       resident = Resident.find(params[:id])
       community = T.must(resident.community)
       feed = MealIcalFeed.new(community, calendar_name: "My #{community.name}", feed: "resident-#{resident.id}")
       cook_dates = Bill.joins(:meal).where(resident_id: resident.id).pluck("meals.date").to_set
       Bill.where(resident_id: resident.id).includes(:meal).find_each { |bill|
         meal = T.must(bill.meal)
         feed.add_meal(meal, summary: "Cook Common Dinner", description: "#{meal.description}\n\n\n\nView here: #{root_url}/meals/#{meal.id}/edit")
       }
    -  MealResident.where(resident_id: resident.id).includes(:meal).find_each { |mr|
    +  MealResident.where(resident_id: resident.id).find_each { |mr|
         meal = T.must(mr.meal)
         if cook_dates.include?(meal.date)
           next
         end
         feed.add_meal(meal, summary: "Attend Common Dinner", description: "#{meal.description}\n\n\n\nView here: #{root_url}/meals/#{meal.id}/edit")
       }
       render(plain: feed.to_ical, content_type: "text/calendar")
     end
- subject: Api::V1::ResidentsController#ical
  kind: same-answer
  why: >-
    The route is `/residents/:id/ical`, so `params` always has `:id` here and `fetch`
    never raises.
  diff: |
    @@ -1,18 +1,18 @@
     def ical
    -  resident = Resident.find(params[:id])
    +  resident = Resident.find(params.fetch(:id))
       community = T.must(resident.community)
       feed = MealIcalFeed.new(community, calendar_name: "My #{community.name}", feed: "resident-#{resident.id}")
       cook_dates = Bill.joins(:meal).where(resident_id: resident.id).pluck("meals.date").to_set
       Bill.where(resident_id: resident.id).includes(:meal).find_each { |bill|
         meal = T.must(bill.meal)
         feed.add_meal(meal, summary: "Cook Common Dinner", description: "#{meal.description}\n\n\n\nView here: #{root_url}/meals/#{meal.id}/edit")
       }
       MealResident.where(resident_id: resident.id).includes(:meal).find_each { |mr|
         meal = T.must(mr.meal)
         if cook_dates.include?(meal.date)
           next
         end
         feed.add_meal(meal, summary: "Attend Common Dinner", description: "#{meal.description}\n\n\n\nView here: #{root_url}/meals/#{meal.id}/edit")
       }
       render(plain: feed.to_ical, content_type: "text/calendar")
     end

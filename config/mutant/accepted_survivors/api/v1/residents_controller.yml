    This line runs after the first line of the method answered "Email required." for
    a blank `params[:email]`, so the key is there and `fetch` never raises.
  diff: |
    @@ -1,19 +1,19 @@
     def token
       if params[:email].blank?
         render(json: { message: "Email required." }, status: :bad_request) and return
       end
       email = params[:email].to_s.strip.downcase
       if email == CommonHouseLogin::EMAIL
         return common_house_token
       end
       resident = Resident.find_by(email:)
       if resident.nil?
    -    return render(json: { message: "No resident with email #{params[:email]}" }, status: :bad_request)
    +    return render(json: { message: "No resident with email #{params.fetch(:email)}" }, status: :bad_request)
       end
       if resident.authenticate(params[:password])
         community = T.must(resident.community)
         render(json: { token: JwtAuth.encode(resident), community_id: community.id, resident_id: resident.id, username: ResidentNameShortener.short(resident.name), timezone: community.timezone })
       else
         render(json: { message: "Incorrect password" }, status: :bad_request)
       end
     end

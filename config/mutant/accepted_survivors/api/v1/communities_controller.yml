- subject: Api::V1::CommunitiesController#cached_month
  kind: same-answer
  why: >-
    Community#calendar_cache_version reads the start with Time.zone.parse(start_date.to_s). The Hash's text is {month:
    11, year: 2026, start_date: "2026-10-25", ...}, and Time.zone.parse finds the first date in it, which is start_date
    (checked with rails runner for two months). The day is the same.
  diff: |
    @@ -1,9 +1,9 @@

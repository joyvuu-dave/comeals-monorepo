    Rack::ETag and Rack::ConditionalGet are in this app's middleware. With a nil ETag, stale? is always true, and
    they set an ETag from the body and answer the same 304 with the same private, max-age=0 Cache-Control, so a
    client sees the same status and body. The spec 'sets an ETag and returns 304' passes either way. result is already
    built, so the call saves no work either.
  diff: |
    @@ -1,17 +1,17 @@
     def calendar
       begin
         date = YearMonthDay.parse(params[:date])
       rescue Date::Error
         return render(json: { message: "Invalid date" }, status: :bad_request)
       end
       start_date = date.beginning_of_month.beginning_of_week(:sunday)
       end_date = start_date + 41.days
       month = (start_date + 20.days).month
       year = (start_date + 20.days).year
       start_date = start_date.to_s
       end_date = end_date.to_s
       result = cached_month(Community.instance, month:, year:, start_date:, end_date:)
    -  if stale?(etag: result, public: false)
    +  if stale?(etag: nil, public: false)
         render(json: result)
       end
     end

---
- subject: Api::V1::ReconciliationsController#preview
  kind: same-answer
  why: >-
    e is a Settlement::InvalidCutoff, a plain ArgumentError subclass. ActiveSupport writes an exception to JSON
    as its to_s, which is its message, so the JSON text is the same.
  diff: |
    @@ -1,9 +1,9 @@
     def preview
       cutoff = YearMonthDay.parse(params.require(:cutoff))
       preview = Settlement.preview(cutoff:)
       render(json: ReconciliationPreviewSerializer.new(preview))
     rescue Date::Error, ActionController::ParameterMissing
       render(json: { message: "cutoff must be a date, YYYY-MM-DD" }, status: :bad_request)
     rescue Settlement::InvalidCutoff => e
    -  render(json: { message: e.message }, status: :bad_request)
    +  render(json: { message: e }, status: :bad_request)
     end
- subject: Api::V1::ReconciliationsController#create
  kind: same-answer
  why: >-
    reconciliation.end_date is a Date (a date column), and ActiveSupport writes a Date to JSON as YYYY-MM-DD, the
    same text as iso8601.
  diff: |
    @@ -1,12 +1,12 @@
     def create
       cutoff = YearMonthDay.parse(params.require(:cutoff))
       settlement = SettleAndNotify.call(cutoff:, retries: SettleAndNotify::REQUEST)
       reconciliation = settlement.reconciliation
    -  render(json: { id: reconciliation.id, date: T.must(reconciliation.date).iso8601, cutoff_date: T.must(reconciliation.end_date).iso8601, meal_count: settlement.meal_count }, status: :created)
    +  render(json: { id: reconciliation.id, date: T.must(reconciliation.date).iso8601, cutoff_date: T.must(reconciliation.end_date), meal_count: settlement.meal_count }, status: :created)
     rescue Date::Error, ActionController::ParameterMissing
       render(json: { message: "cutoff must be a date, YYYY-MM-DD" }, status: :bad_request)
     rescue ActiveRecord::RecordInvalid => e
       render(json: { message: in_the_callers_words(e.record.errors) }, status: :bad_request)
     rescue Settlement::Contested, ActiveRecord::TransactionRollbackError, ActiveRecord::LockWaitTimeout
       render(json: { message: "Someone else was changing these meals at the same time. " "Nothing was saved. Try again." }, status: :conflict)
     end

- subject: ReconciliationWarnings#warning
  kind: same-answer
  why: >-
    All six callers of warning pass severity, title and body. With the key
    there, fetch and [] give the same value.
  diff: |
    @@ -1,7 +1,7 @@
     def warning(kind, meal, bill, words)
       id = "#{kind}:meal=#{meal.id}"
       if bill
         id += ":bill=#{bill.id}"
       end
    -  { id:, kind:, severity: words[:severity], meal_id: meal.id, title: words[:title], body: words[:body] }
    +  { id:, kind:, severity: words.fetch(:severity), meal_id: meal.id, title: words[:title], body: words[:body] }
     end


- subject: ReconciliationWarnings#warnings_for
  kind: same-answer
  why: >-
    The only caller, call, reads warnings_for with flat_map. flat_map takes
    the items out of an Array but keeps a Hash as one item, so the list of
    warnings is the same.
  diff: |
    @@ -1,8 +1,8 @@
     def warnings_for(meal)
       if meal.cancelled?
    -    return [dinner_cancelled(meal)]
    +    return dinner_cancelled(meal)
       end
       blank_bills(meal).map { |bill|
         zero_bill_not_flagged(meal, bill)
       }
     end

- subject: KeyedWrites#keep_request_key
  kind: same-answer
  why: >-
    The writes that use keyed answer 200, 201, a 4xx or a 5xx. None answers a 1xx, 299 or 300, the only statuses where
    these ranges differ.
  diff: |
    @@ -1,10 +1,10 @@
     def keep_request_key(rendering)
       if @request_key.nil?
         return
       end
       status = Rack::Utils.status_code(rendering.fetch(:status, :ok))
    -  unless (200..299).cover?(status)
    +  unless (200..300).cover?(status)
         return
       end
       RequestKey.create!(sender: RequestKey.sender_of(T.must(current_login)), key: @request_key, request_sha256: RequestKey.request_sha256(request), status:, body: JSON.parse(rendering.fetch(:json).to_json))
     end

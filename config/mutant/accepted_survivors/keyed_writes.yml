---
- subject: KeyedWrites#answer_if_request_key_seen
  kind: same-answer
  why: >-
    Without the return, the method goes on with @request_key = header.key, which is nil for a header that is not a key,
    and seen_request_key answers nil for it. So nothing more is rendered or saved.
  diff: |
    @@ -1,15 +1,15 @@
     def answer_if_request_key_seen
       value = request.headers["Idempotency-Key"]
       if value.nil?
         return
       end
       header = IdempotencyKeyHeader.new(value)
       if header.key.nil?
    -    return render(json: { message: header.error }, status: :bad_request)
    +    render(json: { message: header.error }, status: :bad_request)
       end
       @request_key = header.key
       seen = seen_request_key
       if seen
         render(**seen)
       end
     end
- subject: KeyedWrites#seen_request_key
  kind: same-answer
  why: >-
    Both sides are Strings (a SHA-256 in hex), and for Strings != and !eql? agree.
  diff: |
    @@ -1,14 +1,14 @@
     def seen_request_key
       if @request_key.nil?
         return nil
       end
       row = RequestKey.find_by(sender: RequestKey.sender_of(T.must(current_login)), key: @request_key)
       if row.nil?
         return nil
       end
    -  if row.request_sha256 != RequestKey.request_sha256(request)
    +  if !row.request_sha256.eql?(RequestKey.request_sha256(request))
         return { json: { message: RequestKey::OTHER_REQUEST }, status: :unprocessable_content }
       end
       response.set_header(REPLAYED, "true")
       { json: row.body, status: row.status }
     end
- subject: KeyedWrites#seen_request_key
  kind: same-answer
  why: >-
    With no key, RequestKey.find_by(key: nil) finds no row, because key is NOT NULL, so the method answers nil either
    way. The check only saves the query. Both callers that can have no key (keyed and the settle action's rescues) go on
    as for a key not seen.
  diff: |
    @@ -1,14 +1,12 @@
     def seen_request_key
    -  if @request_key.nil?
    -    return nil
    -  end
    +  nil
       row = RequestKey.find_by(sender: RequestKey.sender_of(T.must(current_login)), key: @request_key)
       if row.nil?
         return nil
       end
       if row.request_sha256 != RequestKey.request_sha256(request)
         return { json: { message: RequestKey::OTHER_REQUEST }, status: :unprocessable_content }
       end
       response.set_header(REPLAYED, "true")
       { json: row.body, status: row.status }
     end

- subject: KeyedWrites#keyed
  kind: same-answer
  why: >-
    With no key, the keyed path answers the same: seen_request_key finds no row and keep_request_key returns before it
    writes one, so the write runs and its answer is returned. The check only skips that transaction and the lookup.
  diff: |
    @@ -1,10 +1,10 @@
     def keyed
    -  if @request_key.nil?
    +  if self.nil?
         return yield
       end
       ActiveRecord::Base.transaction {
         seen_request_key || yield.tap { |rendering|
           keep_request_key(rendering)
         }
       }
     end

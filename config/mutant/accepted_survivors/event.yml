- subject: Event#starts_and_ends_on_one_day
  kind: same-answer
  why: >-
    `self.end_date` and `end_date()` call the same public reader on the
    same object, so both give the same value.
  diff: |
    @@ -1,14 +1,14 @@
     def starts_and_ends_on_one_day
       start_date = self.start_date
    -  end_date = self.end_date
    +  end_date = end_date()
       if allday || start_date.nil? || end_date.nil?
         return
       end
       unless times_set_or_changed?
         return
       end
       community = T.must(self.community)
       unless community.date_of(start_date) == community.date_of(end_date)
         errors.add(:base, SAME_DAY)
       end
     end


- subject: SettledMealHistory.writer
  kind: same-answer
  why: >-
    user comes from Audited.store. Nothing in app/ or lib/ sets it to a String
    subclass: the controllers set a record, and only specs pass a plain String
    name to as_user. For a plain String, instance_of?(String) and
    is_a?(String) give the same answer.
  diff: |
    @@ -1,13 +1,13 @@
     def self.writer
       user = ::Audited.store[:audited_user] || ::Audited.store[:current_user]&.call
    -  who = if user.is_a?(String)
    +  who = if user.instance_of?(String)
         { user_type: nil, user_id: nil, username: user }
       else
         if user
           { user_type: user.class.name, user_id: user.id, username: nil }
         else
           { user_type: nil, user_id: nil, username: nil }
         end
       end
       who.merge(request_uuid: ::Audited.store[:current_request_uuid] || SecureRandom.uuid, remote_address: ::Audited.store[:current_remote_address])
     end


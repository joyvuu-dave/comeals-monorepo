- subject: ThirdCookWarning#switching?
  kind: same-answer
  why: >-
    `after` and `@before` are both Arrays of Integers (resident ids). For such Arrays `eql?` and `==` give
    the same answer.
  diff: |
    @@ -1,3 +1,3 @@
     def switching?
    -  after.length == @before.length && after != @before
    +  after.length == @before.length && !after.eql?(@before)
     end

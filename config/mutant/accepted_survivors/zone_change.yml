- subject: ZoneChange#moves?
  kind: same-answer
  why: >-
    `utc_offset` returns a small Integer. For two small Integers `equal?`, `eql?` and `==` give the same
    answer.
  diff: |
    @@ -1,3 +1,3 @@
     def moves?(time)
    -  time.in_time_zone(@old_zone).utc_offset != time.in_time_zone(@new_zone).utc_offset
    +  !time.in_time_zone(@old_zone).utc_offset.equal?(time.in_time_zone(@new_zone).utc_offset)
     end

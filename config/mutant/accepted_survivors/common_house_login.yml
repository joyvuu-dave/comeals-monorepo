---
- subject: CommonHouseLogin#authenticate
  kind: same-answer
  why: >-
    Without the nil check the method goes on to SCrypt, and `is_password?(nil)` answers
    false, so the method still answers false for nil. The one caller, `ResidentsController#common_house_token`,
    also passes only a String. The check stays so the answer does not depend on how
    SCrypt treats nil.
  diff: |
    @@ -1,10 +1,8 @@
     def authenticate(unencrypted_password)
    -  if unencrypted_password.nil?
    -    return false
    -  end
    +  nil
       if SCrypt::Password.new(T.must(password_digest)).is_password?(unencrypted_password)
         self
       else
         false
       end
     end
- subject: CommonHouseLogin#authenticate
  kind: same-answer
  why: >-
    `self.nil?` is never true, so this is the same as having no nil check. Without
    it the method goes on to SCrypt, and `is_password?(nil)` answers false, so the
    method still answers false for nil.
  diff: |
    @@ -1,10 +1,10 @@
     def authenticate(unencrypted_password)
    -  if unencrypted_password.nil?
    +  if self.nil?
         return false
       end
       if SCrypt::Password.new(T.must(password_digest)).is_password?(unencrypted_password)
         self
       else
         false
       end
     end

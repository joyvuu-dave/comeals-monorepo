---
- subject: PasswordReset.resident_for
  kind: same-answer
  why: >-
    Both callers pass `params[:reset_token]`. Text in a request is a plain String,
    never an object of a subclass of String, so `is_a?(String)` and `instance_of?(String)`
    give the same answer.
  diff: |
    @@ -1,6 +1,6 @@
     def self.resident_for(token)
    -  unless token.is_a?(String)
    +  unless token.instance_of?(String)
         return nil
       end
       Resident.find_by(reset_password_token_digest: digest(token))
     end

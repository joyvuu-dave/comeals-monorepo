    +    sentences << "Left alone: #{bill.date}, #{T.must(bill.resident).name}, because #{left.reason}."
       }
       if result.gone.positive?
         sentences << "#{pluralize(result.gone, "cost")} on the list #{if result.gone == 1
       "was"

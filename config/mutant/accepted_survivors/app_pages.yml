- subject: AppPages.load
  kind: same-answer
  why: >-
    The is_a?(Array) before it is true only when the key is there, so page["examples"] and page.fetch("examples") give the
    same Array.
  diff: |
    @@ -1,19 +1,19 @@
     def self.load(file)
       pages = JSON.parse(File.read(file)).fetch("pages")
       unless pages.is_a?(Hash) && !pages.empty?
         raise(Invalid, "#{file} lists no pages")
       end
       pages.each { |name, page|
         path = page["path"]
         unless path.is_a?(String)
           raise(Invalid, "the page #{name} in #{file} has no path")
         end
    -    unless page["examples"].is_a?(Array) && !page["examples"].empty?
    +    unless page["examples"].is_a?(Array) && !page.fetch("examples").empty?
           raise(Invalid, "the page #{name} in #{file} has no example")
         end
         compile(path)
       }
       pages
     rescue JSON::ParserError, KeyError, Errno::ENOENT => e
       raise(Invalid, "could not read the app's pages from #{file}: #{e.message}")
     end
- subject: AppPages.load
  kind: same-answer
  why: Hash#each returns the Hash it was called on, so with the last line gone load still returns pages.
  diff: |
    @@ -1,19 +1,18 @@
     def self.load(file)
       pages = JSON.parse(File.read(file)).fetch("pages")
       unless pages.is_a?(Hash) && !pages.empty?
         raise(Invalid, "#{file} lists no pages")
       end
       pages.each { |name, page|
         path = page["path"]
         unless path.is_a?(String)
           raise(Invalid, "the page #{name} in #{file} has no path")
         end
         unless page["examples"].is_a?(Array) && !page["examples"].empty?
           raise(Invalid, "the page #{name} in #{file} has no example")
         end
         compile(path)
       }
    -  pages
     rescue JSON::ParserError, KeyError, Errno::ENOENT => e
       raise(Invalid, "could not read the app's pages from #{file}: #{e.message}")
     end

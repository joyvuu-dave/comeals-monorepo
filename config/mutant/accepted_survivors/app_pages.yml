- subject: AppPages.load
  kind: same-answer
  why: >-
    JSON.parse makes only plain Hash, Array, String, Integer, Float, true, false and nil, never a subclass, so instance_of?
    and is_a? agree on every value it can read.
  diff: |
    @@ -1,19 +1,19 @@
     def self.load(file)
       pages = JSON.parse(File.read(file)).fetch("pages")
    -  unless pages.is_a?(Hash) && !pages.empty?

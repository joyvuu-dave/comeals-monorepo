---
- subject: AppPages.decode
  kind: same-answer
  why: >-
    Another limit for split only keeps or drops the empty parts at the end of the path, which come from slashes at the end.
    Those parts decode to themselves and never make the path fail to decode, and every pattern takes any number of slashes
    at the end (compile ends each with /*), so the joined path matches the same patterns.
  diff: |
    @@ -1,10 +1,10 @@
     def self.decode(path)
    -  parts = path.split("/", -1).map { |part|
    +  parts = path.split("/").map { |part|
         decode_part(part)
       }
       if parts.all?
         parts.join("/")
       else
         path
       end
     end

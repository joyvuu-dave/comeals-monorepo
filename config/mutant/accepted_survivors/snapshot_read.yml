- subject: SnapshotRead.take_snapshot
  kind: same-answer
  why: >-
    wait_limit is a Duration: the sig says so, and sigs raise. A Duration times 1000 is a Duration, and its
    `ceil` is the ceil of its number of seconds times 1000, the same whole number as from the Float.
  diff: |
    @@ -1,6 +1,6 @@
     def self.take_snapshot(connection, wait_limit)
       statement_limit = connection.select_value("SHOW statement_timeout")
    -  connection.execute("SET LOCAL statement_timeout = '#{(wait_limit.to_f * 1000).ceil}ms'")
    +  connection.execute("SET LOCAL statement_timeout = '#{(wait_limit * 1000).ceil}ms'")
       connection.execute("SELECT 1")
       connection.execute("SET LOCAL statement_timeout = #{connection.quote(statement_limit)}")
     end

- subject: BrowserCount.by_month
  kind: same-answer
  why: >-
    Without `Arel.sql`, Rails accepts this order string as it is, because
    each part is a column name or an alias with ASC, DESC or NULLS LAST.
    So it does not raise, and the SQL is the same.
  diff: |
    @@ -1,4 +1,4 @@
     def self.by_month
       month = Arel.sql("date_trunc('month', date)::date")
    -  select(month.as("month"), :browser, :major, :os, :device, :result, Arel.sql("sum(count)").as("loads")).group(month, :browser, :major, :os, :device, :result).order(Arel.sql("month DESC, loads DESC, browser, major DESC NULLS LAST, os, device, result"))
    +  select(month.as("month"), :browser, :major, :os, :device, :result, Arel.sql("sum(count)").as("loads")).group(month, :browser, :major, :os, :device, :result).order("month DESC, loads DESC, browser, major DESC NULLS LAST, os, device, result")
     end

- subject: Reconciliation#end_date_old_enough
  kind: same-answer
  why: >-
    end_date() with parentheses calls the method, not the new local variable,
    so it reads the same column as self.end_date.
  diff: |
    @@ -1,10 +1,10 @@
     def end_date_old_enough
    -  end_date = self.end_date
    +  end_date = end_date()
       if end_date.nil?
         return
       end
       refusal = Reconciliation.cutoff_refusal(end_date, T.must(community).today)
       if refusal
         errors.add(:end_date, refusal)
       end
     end

- subject: Reconciliation#must_settle_at_least_one_meal
  kind: same-answer
  why: >-
    When this runs, only end_date can have an error. The validations before it
    are community (always filled in by BelongsToTheCommunity before
    validation), end_date, units_recorded_on (always filled in by set_date
    before validation) and end_date_old_enough, which adds to end_date. So
    errors.any? and errors[:end_date].any? give the same answer.
  diff: |
    @@ -1,15 +1,15 @@
     def must_settle_at_least_one_meal
    -  if errors[:end_date].any?
    +  if errors.any?
         return
       end
       if eligible_meals.exists? || MealCorrection.waiting.exists?
         return
       end
       held = left_behind_dates(Meal.unreconciled.receipt_and_nobody_to_charge)
       waiting = left_behind_dates(Meal.unreconciled.waiting_for_a_cost)
       if held.empty? && waiting.empty?
         errors.add(:base, "No unreconciled meals with bills on or before this date. " "A reconciliation must settle at least one meal or carry a correction.")
       else
         errors.add(:base, ["No meal on or before this date can be settled yet.", held_words(held), waiting_words(waiting), "A reconciliation must settle at least one meal or carry a correction."].compact.join(" "))
       end
     end

- subject: Reconciliation.cutoff_refusal
  kind: same-answer
  why: >-
    latest is a Date, and the app sets no default Date format. So Date#to_s
    gives the ISO 8601 text, the same as iso8601.
  diff: |
    @@ -1,7 +1,7 @@
     def self.cutoff_refusal(cutoff, today)
       latest = latest_cutoff(today)
       if cutoff <= latest
         return
       end
    -  "must be on or before #{latest.iso8601}, #{DAYS_TO_WAIT} days before today"
    +  "must be on or before #{latest}, #{DAYS_TO_WAIT} days before today"
     end


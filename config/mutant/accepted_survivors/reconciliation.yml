    +  first_edits = MealCorrection.cost_edits.joins(:meal).where(meals: { reconciliation_id: reconciliations }).select(Arel.sql("DISTINCT ON (meal_corrections.meal_id, cook_id) meals.reconciliation_id"), "meal_corrections.meal_id", MealCorrection::COOK_ID.as("cook_id"), MealCorrection::COST_BEFORE.as("cost_before")).order("meal_corrections.meal_id, cook_id, meal_corrections.id, cost_edit.place")

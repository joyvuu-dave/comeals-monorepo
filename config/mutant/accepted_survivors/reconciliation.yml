- subject: Reconciliation#settlement_balances
  kind: same-answer
  why: >-
    allocate_to_cents returns BigDecimal values. With no values, the plain sum
    is the Integer 0, and 0.zero? is true, the same as for BigDecimal 0. With
    values, the sum is the same number.
  diff: |
    @@ -1,11 +1,11 @@
     def settlement_balances(ledger = settlement_ledger)
       raw_balances = ledger.balances(T.must(community).residents.pluck(:id))
       add_correction_lines!(raw_balances, MealCorrection.where(reconciliation_id: id))
       add_correction_lines!(raw_balances, MealCorrection.where(meal_id: meals), sign: -1)
       balances = Settlement.allocate_to_cents(raw_balances, reconciliation_id: id)
    -  total = balances.values.sum(BigDecimal("0"))
    +  total = balances.values.sum
       unless total.zero?
         raise("settlement_balances: books do not balance for reconciliation #{id}. " "Discrepancy: #{total}. This indicates a bug in Settlement.allocate_to_cents.")
       end
       balances
     end


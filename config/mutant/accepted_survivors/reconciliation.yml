- subject: Reconciliation#settled_cooks_by_meal
  kind: same-answer
  why: >-
    residents.name is NOT NULL, so name is always a String. For a String,
    to_str and to_s both return the same text.
  diff: |
    @@ -1,14 +1,14 @@
     def settled_cooks_by_meal
       rows = Arel::Nodes::TableAlias.new(self.class.settled_dinner_cooks(self.class.where(id:)), "dinner_cooks")
       pairs = T.let(Resident.from(rows).pluck("dinner_cooks.meal_id", "dinner_cooks.resident_id"), T::Array[[Integer, Integer]])
       residents = Resident.where(id: pairs.map(&:last)).index_by { |resident|
         T.must(resident.id)
       }
       pairs.group_by(&:first).transform_values { |list|
         list.map { |_, resident_id|
           residents.fetch(resident_id)
         }.sort_by { |resident|
    -      resident.name.to_s
    +      resident.name.to_str
         }
       }
     end


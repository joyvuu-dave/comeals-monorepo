- subject: LedgerVerification#line_item_check
  kind: same-answer
  why: >-
    Rails turns a record in a where hash into its id, so reconciliation_id:
    reconciliation gives the same SQL as reconciliation_id: reconciliation.id.
  diff: |
    @@ -1,21 +1,21 @@
     def line_item_check(reconciliation)
       charges = MealCharge.for_reconciliation(reconciliation)
    -  carried = MealCorrectionLine.joins(:meal_correction).where(meal_corrections: { reconciliation_id: reconciliation.id })
    +  carried = MealCorrectionLine.joins(:meal_correction).where(meal_corrections: { reconciliation_id: reconciliation })
       unless charges.exists? || carried.exists?
         return nil
       end
       stored = stored_balances(reconciliation)
       summed = T.cast(charges.group(:resident_id).sum(:amount), Balances)
       T.cast(carried.group(:resident_id).sum(:amount), Balances).each { |resident_id, amount|
         summed[resident_id] = summed.fetch(resident_id, BigDecimal("0")) + amount
       }
       differences = line_item_differences(stored, summed)
       total = summed.values.sum(BigDecimal("0"))
       unless total.zero?
         differences << lines_do_not_balance(total)
       end
       if differences.empty?
         return nil
       end
       detail(reconciliation, "line_items", differences)
     end

- subject: LedgerVerification#line_item_check
  kind: same-answer
  why: >-
    With no lines, the plain sum is the Integer 0, and 0.zero? is true, so
    nothing is added, the same as for BigDecimal 0. With lines, the sum starts
    from a BigDecimal and is the same BigDecimal.
  diff: |
    @@ -1,21 +1,21 @@
     def line_item_check(reconciliation)
       charges = MealCharge.for_reconciliation(reconciliation)
       carried = MealCorrectionLine.joins(:meal_correction).where(meal_corrections: { reconciliation_id: reconciliation.id })
       unless charges.exists? || carried.exists?
         return nil
       end
       stored = stored_balances(reconciliation)
       summed = T.cast(charges.group(:resident_id).sum(:amount), Balances)
       T.cast(carried.group(:resident_id).sum(:amount), Balances).each { |resident_id, amount|
         summed[resident_id] = summed.fetch(resident_id, BigDecimal("0")) + amount
       }
       differences = line_item_differences(stored, summed)
    -  total = summed.values.sum(BigDecimal("0"))
    +  total = summed.values.sum
       unless total.zero?
         differences << lines_do_not_balance(total)
       end
       if differences.empty?
         return nil
       end
       detail(reconciliation, "line_items", differences)
     end

- subject: LedgerVerification#line_item_differences
  kind: same-answer
  why: >-
    The hash goes only into ledger_check_runs.details, a jsonb column. Rails
    turns a BigDecimal into text when it is assigned there, using to_s, and
    ActiveSupport makes BigDecimal#to_s use the 'F' format. So the stored and
    logged text is the same.
  diff: |
    @@ -1,10 +1,10 @@
     def line_item_differences(stored, summed)
       (stored.keys | summed.keys).sort.filter_map { |resident_id|
         stored_amount = stored[resident_id] || BigDecimal("0")
         summed_amount = summed[resident_id] || BigDecimal("0")
         if (stored_amount - summed_amount).abs < ONE_CENT
           next
         end
    -    { resident_id:, stored: stored[resident_id]&.to_s("F"), source: summed[resident_id]&.to_s("F") }
    +    { resident_id:, stored: stored[resident_id]&.to_s, source: summed[resident_id]&.to_s("F") }
       }
     end


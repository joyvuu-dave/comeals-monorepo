- subject: AttendanceVersionParam.from_params
  kind: same-answer
  why: >-
    Ruby has no subclass of Integer, and a request parameter that is a number is a plain Integer, so
    `is_a?(Integer)` and `instance_of?(Integer)` give the same answer.
  diff: |
    @@ -1,13 +1,13 @@
     def self.from_params(params)
       raw = params[:attendance_version]
       if raw.nil?
         return nil
       end
    -  if raw.is_a?(Integer) && raw.to_s.match?(DIGITS)
    +  if raw.instance_of?(Integer) && raw.to_s.match?(DIGITS)
         return raw
       end
       if raw.is_a?(String) && raw.match?(DIGITS)
         return Integer(raw, 10)
       end
       REFUSAL
     end

- subject: AttendanceVersionParam.from_params
  kind: same-answer
  why: >-
    The text has just matched DIGITS: only digits, with no leading zero unless it is the single digit 0, and
    no prefix like 0x. Ruby reads such text as a base 10 number whatever base it is given, so `Integer(raw)`
    and `Integer(raw, 0)` give the same number as `Integer(raw, 10)`.

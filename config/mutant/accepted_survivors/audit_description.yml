- subject: AuditDescription#created_amount
  kind: same-answer
  why: >-
    audited_changes is a jsonb column, so a whole number in it is read back as a plain Integer. Ruby has no
    subclass of Integer, so `is_a?` and `instance_of?` give the same answer.
  diff: |
    @@ -1,9 +1,9 @@
     def created_amount(changes)
       if changes.key?("amount")
         return dollars(changes["amount"])
       end
       cents = changes["amount_cents"]
    -  if cents.is_a?(Integer)
    +  if cents.instance_of?(Integer)
         BigDecimal(cents) / 100
       end
     end
- subject: AuditDescription#created_amount
  kind: same-answer
  why: >-
    The line runs only when `changes.key?("amount")` is true, so `fetch` finds the key and gives the same
    value as `[]`.
  diff: |
    @@ -1,9 +1,9 @@
     def created_amount(changes)
       if changes.key?("amount")
    -    return dollars(changes["amount"])
    +    return dollars(changes.fetch("amount"))
       end
       cents = changes["amount_cents"]
       if cents.is_a?(Integer)
         BigDecimal(cents) / 100
       end
     end
- subject: AuditDescription#dollars
  kind: same-answer
  why: >-
    The audited gem writes a bill amount as text ("30.5"), the old amount_cents rows give Integers, and
    amount_change gives BigDecimals. BigDecimal reads text, an Integer and a BigDecimal to the same number
    with or without `to_s`, and nil, true, a list or an object to nil both ways. Only a Float with 17
    significant digits reads differently, and no row holds a Float amount.
  diff: |
    @@ -1,3 +1,3 @@
     def dollars(value)
    -  BigDecimal(value.to_s, exception: false)
    +  BigDecimal(value, exception: false)
     end
- subject: AuditDescription#named_resident_ids
  kind: same-answer
  why: >-
    For a row of another kind `describe` reads no resident: it reads one only for a Bill, MealResident or
    Guest row. So an id taken from such a row only loads a resident that nothing reads. A Meal row has no
    resident_id at all, and `compact` drops its nil. The residents are read in the same one query either
    way.
  diff: |
    @@ -1,8 +1,6 @@
     def named_resident_ids(rows)
       from_changes = rows.filter_map { |row|
    -    if NAMED_THROUGH_HISTORY.include?(row.auditable_type)
    -      row.audited_changes["resident_id"]
    -    end
    +    row.audited_changes["resident_id"]
       }
       (from_changes.flatten + @named_before.values).compact.uniq
     end

- subject: Holidays.easter?
  kind: same-answer
  why: >-
    `f` changes only when `b + 9` is a multiple of 25 (b = 25j + 16), from
    j to j + 1. Then `b - f + 1` goes from 24j + 17 to 24j + 16, and both
    divided by 3 give 8j + 5, so `g` and everything after it are the same.
    Nothing else reads `f`. Checked for every year from 1583 to 2,000,000:
    the same Easter.
  diff: |
    @@ -1,18 +1,18 @@
     def self.easter?(date)
       y = date.year
       a = y % 19
       b = y / 100
       c = y % 100
       d = b / 4
       e = b % 4
    -  f = (b + 8) / 25
    +  f = (b + 9) / 25
       g = (b - f + 1) / 3
       h = ((19 * a) + b - d - g + 15) % 30
       i = c / 4
       k = c % 4
       l = (32 + (2 * e) + (2 * i) - h - k) % 7
       m = (a + (11 * h) + (22 * l)) / 451
       month = (h + l - (7 * m) + 114) / 31
       day = ((h + l - (7 * m) + 114) % 31) + 1
       date.month == month && date.day == day
     end


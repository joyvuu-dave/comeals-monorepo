- subject: Holidays.easter?
  kind: same-answer
  why: >-
    `m` is 0 or 1. When it is 1, `h + l + 114` is 148 or 149, so taking
    off any multiple of `m` from 0 to 8 leaves 140 to 149, and that
    divided by 31 is 4 (April) every time. When `m` is 0 the term is 0
    anyway. Checked for every year from 1583 to 2,000,000: the month is
    the same in each year, so the answer is the same for every date.
  diff: |
    @@ -1,18 +1,18 @@
     def self.easter?(date)
       y = date.year
       a = y % 19
       b = y / 100
       c = y % 100
       d = b / 4
       e = b % 4
       f = (b + 8) / 25
       g = (b - f + 1) / 3
       h = ((19 * a) + b - d - g + 15) % 30
       i = c / 4
       k = c % 4
       l = (32 + (2 * e) + (2 * i) - h - k) % 7
       m = (a + (11 * h) + (22 * l)) / 451
    -  month = (h + l - (7 * m) + 114) / 31
    +  month = (h + l - (6 * m) + 114) / 31
       day = ((h + l - (7 * m) + 114) % 31) + 1
       date.month == month && date.day == day
     end


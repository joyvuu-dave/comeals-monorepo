- subject: CorrectionWords.edit
  kind: same-answer
  why: >-
    Every edit in meal_corrections.edits is written by
    MealCorrecting::Edits#record (by way of MealCorrecting.record!, the only
    writer, and MealCorrection is append-only). record always sets the what,
    resident_id, from and to keys, nil or not. With the key there, fetch and
    [] give the same value.
  diff: |
    @@ -1,15 +1,15 @@
     def self.edit(edit, residents)
       name = residents[edit["resident_id"]]&.name || "Resident ##{edit["resident_id"]}"
       from = edit["from"]
       to = edit["to"]
       case edit["what"]
       when "cost"
         cost(name, from, to)
       when "eater"
         eater(name, from, to)
       when "guest"
         guest(name, from, to)
       else
    -    "#{edit["what"]}: #{from.inspect} to #{to.inspect}"
    +    "#{edit.fetch("what")}: #{from.inspect} to #{to.inspect}"
       end
     end


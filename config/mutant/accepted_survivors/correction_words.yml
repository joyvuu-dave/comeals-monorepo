- subject: CorrectionWords.cost_words
  kind: same-answer
  why: >-
    cost_words is given only a cost that is not nil, and every such cost in
    meal_corrections.edits was made by MealCorrecting::Edits#cost_of, which
    always sets the amount and no_cost keys. With the key there, fetch and []
    give the same value.
  diff: |
    @@ -1,11 +1,11 @@
     def self.cost_words(cost)
    -  if cost["no_cost"]
    +  if cost.fetch("no_cost")
         return "No cost"
       end
       amount = BigDecimal(cost["amount"])
       if amount.zero?
         "blank"
       else
         ActiveSupport::NumberHelper.number_to_currency(amount)
       end
     end


- subject: Resident#children_i_can_edit
  kind: same-answer
  why: >-
    On a relation, `to_ary` is the same method as `to_a`: both load the rows and give
    an Array.
  diff: |
    @@ -1,6 +1,6 @@
     def children_i_can_edit
       if child?
         return []
       end
    -  Resident.where(unit_id:, active: true, email: nil).where.not(id:).order(:name, :id).to_a.select(&:child?)

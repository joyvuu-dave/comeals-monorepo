- subject: Resident#name_unique_with_helpful_message
  kind: same-answer
  why: "`self.name` and `name()` call the same public method on the same object."
  diff: |
    @@ -1,11 +1,11 @@
     def name_unique_with_helpful_message
    -  name = self.name
    +  name = name()
       if name.blank?
         return
       end
       clash = Resident.where("lower(name) = ?", name.downcase).where.not(id:).first
       if clash.nil?
         return
       end
       errors.add(:name, "is already used by the resident in unit #{T.must(clash.unit).name}. " "Add something people use to tell them apart — a middle name, " "Jr./Sr., or a nickname.")
     end
- subject: Resident#birthday_not_in_the_future

     end
- subject: Resident#children_i_can_edit
  kind: same-answer
  why: >-
    The unique index on lower(name) means no two residents have the same name, and
    PostgreSQL never sorts two different names as equal. So the second sort key never
    decides the order, and `nil` there adds nothing.

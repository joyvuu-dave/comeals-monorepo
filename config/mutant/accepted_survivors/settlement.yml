- subject: Settlement.allocate_to_cents
  kind: same-answer
  why: >-
    This branch runs only when pennies is not positive, so pennies is zero or
    negative. An Integer is always true in Ruby, so the new test also passes
    when pennies is zero. Then no penny moves: 0.times does nothing, and the
    check of the candidates passes for zero pennies. So the balances are the
    same.
  diff: |
    @@ -1,31 +1,31 @@
     def self.allocate_to_cents(raw_balances, reconciliation_id:)
       assert_balanced_input!(raw_balances, reconciliation_id)
       one_cent = BigDecimal("0.01")
       (truncated, remainders) = truncate_toward_zero(raw_balances)
       residual = truncated.values.sum(BigDecimal("0"))
       pennies = (residual / one_cent).to_i
       if pennies.positive?
         candidates = remainders.select { |_, r|
           r.negative?
         }.sort_by { |id, r|
           [r, id]
         }
         assert_candidates_cover_pennies!(candidates, pennies, reconciliation_id)
         pennies.times { |i|
           adjust!(truncated, candidates.fetch(i).first, -one_cent)
         }
       else
    -    if pennies.negative?
    +    if pennies
           candidates = remainders.select { |_, r|
             r.positive?
           }.sort_by { |id, r|
             [-r, id]
           }
           assert_candidates_cover_pennies!(candidates, pennies.abs, reconciliation_id)
           pennies.abs.times { |i|
             adjust!(truncated, candidates.fetch(i).first, one_cent)
           }
         end
       end
       truncated
     end


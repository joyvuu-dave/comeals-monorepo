- subject: Settlement.preview
  kind: same-answer
  why: >-
    The corrections are preloaded only so that the preview reads them in few
    queries. The app uses goldiloader. When one record of a list reads an
    association that was not preloaded, goldiloader loads it for every record
    of the list in one query. So the same rows are loaded, and the answer is
    the same.
  diff: |
    @@ -1,15 +1,15 @@
     def self.preview(cutoff:, community: Community.instance)
       today = community.today
       refusal = Reconciliation.cutoff_refusal(cutoff, today)
       if refusal
         raise(InvalidCutoff, "cutoff #{refusal}")
       end
       meals = Meal.settleable_by(cutoff).order(:date).preload({ bills: :resident }, :meal_residents, :guests).to_a
       ledger = MealLedger.new(meals)
    -  corrections = MealCorrection.waiting.order(:id).preload(:meal, :admin_user, lines: :resident).to_a
    +  corrections = MealCorrection.waiting.order(:id).to_a
       raw = ledger.balances(community.residents.pluck(:id))
       corrections.flat_map(&:lines).each { |line|
         raw[T.must(line.resident_id)] = raw.fetch(T.must(line.resident_id)) + T.must(line.amount)
       }
       Preview.new(cutoff:, meals:, ledger:, resident_balances: allocate_to_cents(raw, reconciliation_id: "preview"), skipped_meals: skipped_by(cutoff, today:), held_meals: held_by(cutoff, today:), waiting_meals: waiting_by(cutoff, today:), corrections:)
     end


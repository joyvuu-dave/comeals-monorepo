- subject: Settlement.fingerprint
  kind: same-answer
  why: >-
    cutoff is a Date (the sig says so), and the app sets no default Date
    format. So Date#to_s, which join uses, gives the ISO 8601 text, the same
    as iso8601.
  diff: |
    @@ -1,8 +1,8 @@
     def self.fingerprint(cutoff:, meal_ids:, correction_ids:, balances:)
       amounts = balances.reject { |_, amount|
         amount.zero?
       }.sort.map { |id, amount|
         "#{id}:#{amount.to_s("F")}"
       }
    -  Digest::SHA256.hexdigest([cutoff.iso8601, meal_ids.sort.join(","), correction_ids.sort.join(","), amounts.join(",")].join("|"))
    +  Digest::SHA256.hexdigest([cutoff, meal_ids.sort.join(","), correction_ids.sort.join(","), amounts.join(",")].join("|"))
     end

- subject: Settlement.fingerprint
  kind: same-answer
  why: >-
    ActiveSupport changes BigDecimal#to_s so that with no argument it uses the
    'F' format. So the text is the same.
  diff: |
    @@ -1,8 +1,8 @@
     def self.fingerprint(cutoff:, meal_ids:, correction_ids:, balances:)
       amounts = balances.reject { |_, amount|
         amount.zero?
       }.sort.map { |id, amount|
    -    "#{id}:#{amount.to_s("F")}"
    +    "#{id}:#{amount.to_s}"
       }
       Digest::SHA256.hexdigest([cutoff.iso8601, meal_ids.sort.join(","), correction_ids.sort.join(","), amounts.join(",")].join("|"))
     end


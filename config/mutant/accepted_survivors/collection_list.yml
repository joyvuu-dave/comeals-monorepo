- subject: CollectionList#initialize
  kind: same-answer
  why: >-
    Without `to_a`, `lines` is the relation itself. The method only reads it with `partition` and `map`,
    which load it once and then use the loaded rows, so the rows and the number of queries are the same.
  diff: |
    @@ -1,17 +1,17 @@
     def initialize(reconciliation)
    -  lines = reconciliation.reconciliation_balances.includes(:resident).to_a
    +  lines = reconciliation.reconciliation_balances.includes(:resident)

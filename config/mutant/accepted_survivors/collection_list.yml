- subject: CollectionList#by_name
  kind: same-answer
  why: >-
    `T.unsafe` returns its argument unchanged when the code runs; it only tells Sorbet not to check the
    call. So the name and its `downcase(:fold)` are the same.
  diff: |
    @@ -1,5 +1,5 @@
     def by_name(list)
       list.sort_by { |person|
    -    T.unsafe(person.name).downcase(:fold)
    +    person.name.downcase(:fold)
       }
     end

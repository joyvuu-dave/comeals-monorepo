- subject: HasPhoneNumber#normalize_phone
  kind: same-answer
  why: >-
    `self.phone` and `phone()` call the same public reader on the same
    object, so both give the same value.
  diff: |
    @@ -1,11 +1,11 @@
     def normalize_phone
    -  phone = self.phone
    +  phone = phone()
       if phone.blank?
         self.phone=nil
       else
         parsed = Phonelib.parse(phone)
         if parsed.valid?
           self.phone=parsed.e164
         end
       end
     end

- subject: HasPhoneNumber#normalize_phone
  kind: same-answer
  why: >-
    The number is valid here, and the `to_s` of a valid Phonelib number is
    its E.164 form. The phone column is a string, and Rails casts a value
    for a string column with `to_s`, so the same text is stored.
  diff: |
    @@ -1,11 +1,11 @@
     def normalize_phone
       phone = self.phone
       if phone.blank?
         self.phone=nil
       else
         parsed = Phonelib.parse(phone)
         if parsed.valid?
    -      self.phone=parsed.e164
    +      self.phone=parsed
         end
       end
     end


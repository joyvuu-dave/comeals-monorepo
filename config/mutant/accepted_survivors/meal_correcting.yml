- subject: MealCorrecting.loaded
  kind: same-answer
  why: >-
    Rails turns a record in a where hash into its id, so id: meal gives the
    same SQL as id: meal.id.
  diff: |
    @@ -1,3 +1,3 @@
     def self.loaded(meal)
    -  Meal.where(id: meal.id).preload(:bills, :meal_residents, :guests).sole
    +  Meal.where(id: meal).preload(:bills, :meal_residents, :guests).sole
     end

- subject: MealCorrecting.loaded
  kind: same-answer
  why: >-
    loaded returns one meal, and both callers give it to MealLedger (one by
    way of SettledDinnerDifference.for, which reads only its id besides),
    which reads meal.bills, meal.meal_residents and meal.guests. Without the
    preload, Rails loads the same rows when each is first read, so the lines
    are the same.
  diff: |
    @@ -1,3 +1,3 @@
     def self.loaded(meal)
    -  Meal.where(id: meal.id).preload(:bills, :meal_residents, :guests).sole
    +  Meal.where(id: meal.id).sole
     end

- subject: MealCorrectionForm#residents
  kind: same-answer
  why: >-
    found.size and texts.size are both Integers. For two Integers, eql? gives
    the same answer as ==.
  diff: |
    @@ -1,13 +1,13 @@
     def residents(raw)
       texts = raw.map(&:to_s).reject(&:empty?).uniq
       ids = texts.map { |text|
         T.let(Integer(text, 10, exception: false), T.nilable(Integer))
       }
       found = Resident.where(id: ids).sort_by { |resident|
         Rows.name_of(resident)
       }
    -  if found.size != texts.size
    +  if !found.size.eql?(texts.size)
         raise(Invalid, "The form named a resident who does not exist. #{CHANGED}")
       end
       found
     end

- subject: MealCorrectionForm#residents
  kind: same-answer
  why: >-
    found.size and texts.size are both small Integers, and Ruby keeps one
    object for each small Integer. So equal? gives the same answer as ==.
  diff: |
    @@ -1,13 +1,13 @@
     def residents(raw)
       texts = raw.map(&:to_s).reject(&:empty?).uniq
       ids = texts.map { |text|
         T.let(Integer(text, 10, exception: false), T.nilable(Integer))
       }
       found = Resident.where(id: ids).sort_by { |resident|
         Rows.name_of(resident)
       }
    -  if found.size != texts.size
    +  if !found.size.equal?(texts.size)
         raise(Invalid, "The form named a resident who does not exist. #{CHANGED}")
       end
       found
     end
- subject: MealCorrectionForm#read_cooks
  kind: same-answer
  why: "Without the skip, an unchanged cook becomes a step that MealCorrecting::Edits#cost applies with no change: the bill has no saved_changes, so nothing is written or recorded, and a save with only such steps is refused with NothingChanged, the same as with the skip. The only difference is one Bill.find_by for each unchanged cook. The line stays because it says in the form that an unchanged cook is not an edit."
  diff: |
    @@ -1,24 +1,22 @@
     def read_cooks
       sent = section("cooks")
       refuse_unknown(sent, @bills.map(&:resident_id))
       @bills.each { |bill|
         row = sent[bill.resident_id.to_s]
         unless row.is_a?(Hash)
           next
         end
         cook = T.must(bill.resident)
         if checked?(row["remove"])
           @steps << ->(edits) {
             edits.remove_cook(cook)
           }
           next
         end
         (amount, no_cost) = cost(row, cook)
    -    if amount == bill.amount && no_cost == bill.no_cost
    -      next
    -    end
    +    nil
         @steps << ->(edits) {
           edits.cost(cook, amount:, no_cost:)
         }
       }
     end

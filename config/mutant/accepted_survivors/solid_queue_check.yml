- subject: SolidQueueCheck.verify_processes!
  kind: same-answer
  why: >-
    solid_queue_processes.kind is a NOT NULL text column, so `pluck(:kind)` gives Strings, and `to_s` and
    `to_str` on a String return the same String.
  diff: |
    @@ -1,9 +1,9 @@
     def self.verify_processes!
       alive = SolidQueue::Process.where(last_heartbeat_at: HEARTBEAT_WITHIN.ago..).pluck(:kind).map { |kind|
    -    kind.to_s.sub(/\(\w+\)\z/, "")
    +    kind.to_str.sub(/\(\w+\)\z/, "")
       }
       problem = process_problem(alive)
       if problem
         raise(problem)
       end
     end

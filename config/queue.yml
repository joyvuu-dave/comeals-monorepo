# Solid Queue processes. One dispatcher (moves scheduled jobs to ready) and
# one worker with one thread. The worker runs the three daily tasks in
# config/recurring.yml, which take seconds, and one at a time is the point
# for them (RecurringJob limits concurrency per job anyway). It also runs
# every live update (LivePushJob, ADR 0007). Polling every 5 seconds keeps
# the number of queries low, but it means a change can reach other open
# screens up to about 5 seconds late.
#
# In production the supervisor runs on its own dyno: `worker: env
# RAILS_DB_POOL=12 bin/jobs --mode async` in the Procfile. In async mode
# the dispatcher, the worker and the scheduler are threads of the
# supervisor's one process, and every thread draws from its one pool of
# 12. spec/config/procfile_spec.rb counts the threads that can hold a
# connection at the same moment, and fails if raising `threads` (or
# adding a recurring task due at the same minute as another) needs a
# larger pool than the Procfile gives. Solid Queue's own bookkeeping runs
# at READ COMMITTED (config/initializers/solid_queue_isolation.rb).
default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 100
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

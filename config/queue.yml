# Solid Queue processes. One dispatcher (moves scheduled jobs to ready) and
# one worker with one thread. The worker runs the three daily tasks in
# config/recurring.yml, which take seconds, and one at a time is the point
# for them (RecurringJob limits concurrency per job anyway). It also runs
# every live update (LivePushJob, ADR 0007). Polling every 5 seconds keeps
# the number of queries low, but it means a change can reach other open
# screens up to about 5 seconds late.
#
# In production the supervisor runs on its own dyno: `worker: bin/jobs` in
# the Procfile. It runs in fork mode, so the dispatcher, the worker and the
# scheduler are three processes beside it, each with its own database pool
# of RAILS_DB_POOL connections.
default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 100
  workers:
    - queues: "*"
      threads: 1
      processes: 1
      polling_interval: 5

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

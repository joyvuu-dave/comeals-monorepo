# PostgreSQL. Versions 9.1 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On OS X with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On OS X with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem 'pg'
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # http://guides.rubyonrails.org/configuring.html#database-pooling
  #
  # Deliberately NOT tied to RAILS_MAX_THREADS. Those are two different
  # things that used to share one env var: threads are how many requests
  # run at once, the pool is how many database connections exist. The web
  # dyno still serves one request at a time (config/puma.rb, 1 thread, 0
  # workers) — this is not a step toward concurrent requests.
  #
  # Note that one request at a time is not the same as one database writer
  # at a time: rake tasks run in their own dynos alongside the web dyno.
  # See docs/adr/0003-concurrency-on-the-money-path.md.
  #
  # 2, not 1, because solid_cache trims old entries on a background thread
  # that needs its own connection. With a pool of 1 that thread competes
  # with the request thread for the only connection there is. Two is the
  # smallest number that gives it one. If ConnectionTimeoutError ever shows
  # up in the logs, raise RAILS_DB_POOL rather than editing this line.
  pool: <%= ENV.fetch("RAILS_DB_POOL") { 2 } %>

  # Every environment runs at SERIALIZABLE (ADR 0005). This was in the test
  # block alone while the retry work was built and proved; it is here now, so
  # development and production run the same way.
  #
  # `variables` are issued as SET SESSION on each new connection, which is the
  # only place this can go. SET TRANSACTION is refused once a transaction has
  # run a query, and under transactional fixtures there is always one open.
  #
  # Here rather than ALTER ROLE, because it is unknown whether a role-level
  # setting is still there after Heroku rotates credentials. This file is.
  #
  # What relies on this: RetryOnConflict on the API's meal writes, the rescue
  # in config/initializers/active_admin_conflict_rescue.rb, and the added
  # transient error in config/initializers/solid_cache.rb. Do not set this on
  # a deploy that does not have all three. See app/services/snapshot_read.rb
  # for the batch reads, which are stricter still.
  # The two timeouts turn "stuck forever" into "fails loudly in seconds".
  # A statement that runs 10 seconds on a 33 MB database is a bug, and a
  # loud early failure is the correct response to a bug. A lock wait that
  # lasts 5 seconds means another writer holds the row; the API and admin
  # render ActiveRecord::LockWaitTimeout as "try again"
  # (Api::V1::MealsController#with_meal_lock,
  # config/initializers/active_admin_conflict_rescue.rb).
  # RetryOnConflict does not retry either timeout — it retries only
  # TransactionRollbackError — so a timeout is never paid for twice.
  #
  # Migrations are not governed by these values: strong_migrations sets its
  # own per-migration timeouts (config/initializers/strong_migrations.rb).
  # A rake task that proves it needs longer may raise its own limit with
  # SET statement_timeout at its start — a visible per-task exception.
  #
  # config/initializers/verify_transaction_isolation.rb checks at boot that
  # the isolation setting below actually reached the session, and
  # spec/config/database_config_spec.rb pins this file's shape.
  variables:
    default_transaction_isolation: serializable
    statement_timeout: 10s
    lock_timeout: 5s

development:
  <<: *default
  database: comeals_development

  # The specified database role being used to connect to postgres.
  # To create additional roles in postgres see `$ createuser --help`.
  # When left blank, postgres will use the default role. This is
  # the same name as the operating system user that initialized the database.
  #username: comeals

  # The password associated with the postgres role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # Agent worktrees set TEST_DB_SUFFIX in their .env (bin/agent-worktree),
  # so each worktree tests against its own database and parallel test runs
  # never share state. Unset — the main checkout — this is plain
  # comeals_test. dotenv-rails loads .env in development and test, so the
  # suffix reaches RSpec and rake without any shell setup.
  database: comeals_test<%= ENV["TEST_DB_SUFFIX"] %>

# As with config/secrets.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password as a unix environment variable when you boot
# the app. Read http://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full rundown on how to provide these environment variables in a
# production deployment.
#
# On Heroku and other platform providers, you may have a full connection URL
# available as an environment variable. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# You can use this database configuration with:
#
#   production:
#     url: <%= ENV['DATABASE_URL'] %>
#
production:
  <<: *default

  # CAUTION: this hash REPLACES the default one — YAML merge keys are
  # shallow, so a `variables:` key here throws away everything the default
  # block set. Every line from the default block must be repeated here, or
  # production silently loses it. Losing `default_transaction_isolation`
  # would be the worst regression this file can have, which is why
  # config/initializers/verify_transaction_isolation.rb refuses to boot
  # without it and spec/config/database_config_spec.rb pins this hash.
  #
  # idle_in_transaction_session_timeout is production-only: it kills a
  # session that sits inside an open transaction doing nothing — in
  # practice a forgotten `heroku run console`, which would otherwise block
  # vacuum and the settlement triggers forever. It cannot go in the default
  # block: the test suite's transactional fixtures legitimately idle inside
  # a transaction between examples, and a debugger pause in development
  # does the same.
  variables:
    default_transaction_isolation: serializable
    statement_timeout: 10s
    lock_timeout: 5s
    idle_in_transaction_session_timeout: 5min
<% if ENV['LOCAL_PRODUCTION'] %>
  # bin/prod runs the production environment on a laptop. It should use
  # the local development database, not try to reach the real one.
  database: comeals_development
<% else %>
  database: comeals_production
  username: comeals
  password: <%= ENV['COMEALS_DATABASE_PASSWORD'] %>
<% end %>

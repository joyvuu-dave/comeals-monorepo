<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#CCDEEA" />
    <meta
      name="description"
      content="Post your common meal. Sign up for others. Reconcile the costs."
    />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="preconnect" href="https://stats.pusher.com" />
    <link
      rel="preload"
      href="/src/fonts/roboto-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Comeals</title>
    <style>
      /* Styles for the static shell inside #root only. Inline on
         purpose: in dev, Vite injects the app stylesheet with
         JavaScript, which is exactly what the shell must not wait
         for. The colors and header height copy styles.css
         (--hasana-yellow, .header). */
      .shell-header {
        height: 2rem;
        background-color: #e9c46a;
      }
      .shell-loading {
        margin: 1rem 0.5rem;
        font-family: Roboto, sans-serif;
        font-size: 1.17rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="background-color: #ccdeea">
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root">
      <!-- Static shell: paints while the JavaScript bundle is still
           downloading and running (issue #44 item 1). It copies the
           app's own first-paint look — the yellow header bar every
           page starts with, and the Suspense "Loading..." fallback.
           React replaces all of this on mount. -->
      <header class="shell-header"></header>
      <h3 class="shell-loading">Loading...</h3>
    </div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      function idleTimer() {
        var t;
        window.onmousemove = resetTimer;
        window.onmousedown = resetTimer;
        window.onclick = resetTimer;
        window.onscroll = resetTimer;
        window.onkeydown = function (e) {
          if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
          resetTimer();
        };
        window.addEventListener("touchstart", resetTimer, { passive: true });

        function navHome() {
          window.location.href = "/";
        }

        function resetTimer() {
          clearTimeout(t);
          t = setTimeout(navHome, 1000 * 60 * 5);
        }
      }

      idleTimer();
    </script>
  </body>
</html>

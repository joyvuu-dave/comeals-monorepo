<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#CCDEEA" />
    <meta
      name="description"
      content="Post your common meal. Sign up for others. Reconcile the costs."
    />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="preconnect" href="https://stats.pusher.com" />
    <link
      rel="preload"
      href="/src/fonts/roboto-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Comeals</title>
    <style>
      /* Styles for the static shell inside #root only. Inline on
         purpose: in dev, Vite injects the app stylesheet with
         JavaScript, which is exactly what the shell must not wait
         for. The colors and header height copy styles.css
         (--hasana-yellow, .header). */
      .shell-header {
        height: 2rem;
        background-color: #e9c46a;
      }
      .shell-loading {
        margin: 1rem 0.5rem;
        font-family: Roboto, sans-serif;
        font-size: 1.17rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="background-color: #ccdeea">
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root">
      <!-- Static shell: paints while the JavaScript bundle is still
           downloading and running (issue #44 item 1). It copies the
           app's own first-paint look — the yellow header bar every
           page starts with, and the Suspense "Loading..." fallback.
           React replaces all of this on mount. -->
      <header class="shell-header"></header>
      <h3 class="shell-loading">Loading...</h3>
    </div>
    <script type="module" src="/src/index.jsx"></script>
    <script>
      // After 5 minutes with no touch, go back to the calendar. Before it
      // goes, two checks, and if either fails it tries again in 30 seconds:
      //   1. Nothing on the page can be lost: no calendar form holds
      //      unsaved changes (window.Comeals.modalDirty, set by
      //      calendar/show.jsx) and no text field with text in it has the
      //      focus.
      //   2. The server answers. During a deploy Heroku shows its
      //      maintenance page, which never reloads, so a screen sent there
      //      would stay on it.
      // The timer starts at the first touch. The version banner starts it
      // too when a new build is out (window.idleTimerKick), so a page that
      // nobody touches moves to the new build 5 minutes after a deploy.
      function idleTimer() {
        var IDLE_MS = 1000 * 60 * 5;
        var RETRY_MS = 1000 * 30;
        var t;
        // A touch while the server check is on its way cancels it.
        var generation = 0;
        window.onmousemove = resetTimer;
        window.onmousedown = resetTimer;
        window.onclick = resetTimer;
        window.onscroll = resetTimer;
        window.onkeydown = function (e) {
          if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
          resetTimer();
        };
        window.addEventListener("touchstart", resetTimer, { passive: true });
        window.idleTimerKick = resetTimer;

        function typedTextHasFocus() {
          var el = document.activeElement;
          if (!el) return false;
          if (el.isContentEditable) return true;
          if (el.tagName === "TEXTAREA") return el.value !== "";
          if (el.tagName !== "INPUT") return false;
          var textTypes = [
            "text",
            "email",
            "password",
            "number",
            "search",
            "tel",
            "url",
          ];
          return textTypes.indexOf(el.type) !== -1 && el.value !== "";
        }

        function nothingToLose() {
          var app = window.Comeals;
          if (app && app.modalDirty) return false;
          return !typedTextHasFocus();
        }

        function tryAgainLater() {
          clearTimeout(t);
          t = setTimeout(navHome, RETRY_MS);
        }

        function navHome() {
          if (!nothingToLose()) {
            tryAgainLater();
            return;
          }
          var asked = generation;
          fetch("/api/v1/version", { cache: "no-store" }).then(
            function (response) {
              if (asked !== generation) return;
              if (response.ok) {
                window.location.href = "/";
              } else {
                tryAgainLater();
              }
            },
            function () {
              if (asked !== generation) return;
              tryAgainLater();
            },
          );
        }

        function resetTimer() {
          generation += 1;
          clearTimeout(t);
          t = setTimeout(navHome, IDLE_MS);
        }
      }

      idleTimer();
    </script>
  </body>
</html>
